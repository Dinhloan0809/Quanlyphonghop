<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghi nhớ nhanh – Grammar Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#faf9ff;--text:#241541;--muted:#9c93b5;--primary:#8b7ff5;--primary-dark:#7267e0;--shadow:0 8px 20px rgba(80,60,140,.07);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text);}
  h1{font-family:'Baloo 2';margin:0;font-size:1.05rem;}
  a{text-decoration:none;color:inherit;}
  .page{max-width:560px;margin:0 auto;padding:14px 14px 40px;}
  .m-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .back-btn{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:var(--shadow);border:none;
    display:flex;align-items:center;justify-content:center;font-size:1.05rem;color:var(--text);flex:0 0 36px;}
  .badge{display:inline-block;background:#efe9ff;color:var(--primary-dark);font-weight:700;font-size:.72rem;padding:4px 12px;border-radius:999px;margin-bottom:8px;}
  .card{background:#fff;border-radius:22px;padding:16px;box-shadow:var(--shadow);text-align:center;}
  .card img{width:100%;border-radius:14px;display:block;}
  .hint{color:var(--muted);font-size:.78rem;margin-top:12px;}
  .empty-box{border:2px dashed rgba(36,21,65,.15);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted);font-size:.9rem;}
  .loading{color:var(--muted);font-size:.86rem;padding:40px 0;text-align:center;}
</style>
</head>
<body>
<div class="page" id="page"><p class="loading">Đang tải...</p></div>

<script>
  const SUPABASE_URL = 'https://zwkphtxotqdzilotiwpf.supabase.co';
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3a3BodHhvdHFkemlsb3Rpd3BmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MDUwNDgsImV4cCI6MjEwMTE4MTA0OH0.ftxH01_FlELoc1m9cPunoMNcxvKeEDnJ-ccu26IHxjg';
  async function rpc(fn, body){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method:'POST', headers:{'Content-Type':'application/json','apikey':ANON_KEY,'Authorization':`Bearer ${ANON_KEY}`},
      body: JSON.stringify(body)
    });
    return res.json();
  }
  function getStageOrder(){ return parseInt(new URL(window.location.href).searchParams.get('stage')) || 1; }

  async function init(){
    const stageOrder = getStageOrder();
    const stages = await rpc('list_stages', {});
    const stage = stages.find(s => s.order_no === stageOrder);
    const page = document.getElementById('page');

    const header = `
      <div class="m-header">
        <a class="back-btn" href="xem-chang.html?stage=${stageOrder}">←</a>
        <h1>🧠 Ghi nhớ nhanh</h1>
      </div>
      <span class="badge">${stage?.badge_label || ''}</span>
    `;

    if(stage && stage.mindmap_url){
      page.innerHTML = `
        ${header}
        <div class="card">
          <img src="${stage.mindmap_url}" alt="Mindmap ${stage.title}">
        </div>
        <p class="hint">Chạm giữ / bấm chuột phải vào ảnh để lưu về máy nếu muốn ôn lại sau.</p>
      `;
    } else {
      page.innerHTML = `${header}<div class="empty-box">🚧 Chặng này chưa có mindmap.</div>`;
    }
  }
  init();
</script>
</body>
</html>
