<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang quản trị – Ôn luyện CCHN</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="dang-bai.js?v=3"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  /* Dùng chung lựa chọn sáng/tối với trang học viên */
  (function(){ try{ if(localStorage.getItem("cchn_theme")==="dark") document.documentElement.setAttribute("data-theme","dark"); }catch(e){} })();
</script>
<style>
  /* Bảng màu đồng bộ với trang học viên (portal.html) */
  :root{
    --bg:#E6ECF7; --surface:#FFFFFF; --surface2:#EEF3FC; --line:#C6D3E9; --line-strong:#9FB4D8; --box:#7FA8EA; --box-head:#DCE8FD;
    --text:#0F1B3D; --muted:#4F5B78; --faint:#6E7896;
    --accent:#0B6BF5; --on-accent:#FFFFFF; --accent-soft:#E3EEFF; --accent-text:#0A5AD0;
    --cta-grad:linear-gradient(135deg,#FF8A2B 0%,#F25F0D 100%); --on-cta:#FFFFFF; --cta-shadow:0 6px 16px rgba(242,95,13,.25);
    --hi:#FFD23F;
    --ok:#15803D; --ok-soft:#E5F5EA; --bad:#C81E1E; --bad-soft:#FDE8E8; --warn:#9A5B00; --warn-soft:#FFF4D6; --warn-line:#F2D27A;
    --shadow:0 1px 2px rgba(15,27,61,.08), 0 8px 22px rgba(15,27,61,.09);
    color-scheme:light;
    /* tên cũ dùng trong mã */
    --navy:var(--accent-text); --ice:var(--accent-soft); --white:var(--surface); --dark:var(--text); --light:var(--surface2); --green:var(--ok); --red:var(--bad);
  }
  :root[data-theme="dark"]{
    --bg:#1A1B1E; --surface:#232428; --surface2:#2C2E33; --line:#454850; --line-strong:#5C606A; --box:#4F74B0; --box-head:#26344C;
    --text:#ECEDEF; --muted:#A8ABB2; --faint:#8E929A;
    --accent:#5A9CFF; --on-accent:#0E1A33; --accent-soft:#25344F; --accent-text:#8EBBFF;
    --cta-grad:linear-gradient(135deg,#FF8A2B 0%,#F2600F 100%); --cta-shadow:0 4px 14px rgba(255,122,26,.18);
    --ok:#5BD68A; --ok-soft:#1E3327; --bad:#FF8F8F; --bad-soft:#3B2427; --warn:#FFCF5A; --warn-soft:#332C1A; --warn-line:#5E5130;
    --shadow:0 1px 2px rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.22);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Be Vietnam Pro',-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent-text);}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  header{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);color:var(--text);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;min-width:0;}
  .logo-icon{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:8px;flex:none;}
  .logo-icon span{border-radius:3px;background:var(--on-accent);}
  .logo-icon span:nth-child(2),.logo-icon span:nth-child(3){opacity:.45;}
  .logo-icon span:nth-child(4){background:var(--hi);opacity:1;}
  header h1{margin:0;font-size:1.05rem;font-weight:800;line-height:1.25;}
  header .sub{margin:1px 0 0;color:var(--muted);font-size:.8rem;}
  .head-actions{display:flex;gap:8px;align-items:center;}
  .theme-toggle{width:42px;height:42px;padding:0;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;}
  .theme-toggle:hover{background:var(--surface2);}
  .theme-toggle svg{width:19px;height:19px;}
  .theme-toggle .ic-sun{display:none;}
  :root[data-theme="dark"] .theme-toggle .ic-sun{display:block;}
  :root[data-theme="dark"] .theme-toggle .ic-moon{display:none;}

  main{max-width:1080px;margin:0 auto;padding:24px 20px 48px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);}
  .card .card{box-shadow:none;border-radius:14px;}
  .card h2{margin:0 0 14px;font-size:1.05rem;font-weight:800;color:var(--text);}
  .card h3{color:var(--text);}
  label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 6px;color:var(--text);}
  input[type=text],input[type=password],input[type=number],input[type=email],input[type=tel],input[type=url],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:.92rem;font-family:inherit;background:var(--surface);color:var(--text);}
  input::placeholder,textarea::placeholder{color:var(--faint);}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);}
  input[type=checkbox],input[type=radio]{accent-color:var(--accent);}
  button{cursor:pointer;border:none;border-radius:10px;font-size:.88rem;font-weight:600;padding:10px 16px;font-family:inherit;min-height:40px;}
  button:disabled{opacity:.55;cursor:default;}
  .btn-primary{background:var(--cta-grad);color:var(--on-cta);font-weight:700;box-shadow:var(--cta-shadow);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-danger{background:var(--bad);color:#fff;}
  :root[data-theme="dark"] .btn-danger{color:#2A0F12;}
  .btn-danger:hover{filter:brightness(1.08);}
  .btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--line);}
  .btn-secondary:hover{background:var(--surface2);border-color:var(--line-strong);}
  a.btn-secondary{display:inline-flex;align-items:center;padding:9px 14px;border-radius:10px;font-weight:600;font-size:.88rem;text-decoration:none;min-height:42px;}
  table{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:10px;}
  th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{color:var(--muted);font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;background:var(--surface2);}
  th:first-child{border-top-left-radius:10px;} th:last-child{border-top-right-radius:10px;}
  tr:hover td{background:color-mix(in srgb, var(--surface2) 55%, transparent);}
  td button{min-height:34px;padding:6px 10px;font-size:.8rem;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:160px;}
  .msg{font-size:.86rem;margin-top:10px;padding:10px 12px;border-radius:10px;}
  .msg:empty{display:none;}
  .msg.ok{background:var(--ok-soft);color:var(--ok);}
  .msg.err{background:var(--bad-soft);color:var(--bad);}
  .muted{color:var(--muted);font-size:.85rem;}
  .pill{display:inline-block;background:var(--accent-soft);color:var(--accent-text);font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;}
  .hidden{display:none !important;}
  .center{text-align:center;}
  .tabs{position:sticky;top:67px;z-index:20;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px;margin-bottom:18px;box-shadow:var(--shadow);overflow-x:auto;}
  .tab-btn{flex:1;min-width:150px;white-space:nowrap;background:transparent;color:var(--muted);border-radius:11px;padding:10px 14px;font-weight:700;font-size:.88rem;text-align:center;}
  .tab-btn:hover{background:var(--surface2);color:var(--text);}
  .tab-btn.active{background:var(--accent-soft);color:var(--accent-text);}
  .tab-content.hidden{display:none;}
  #login-card{max-width:420px;margin:40px auto;}
  #login-card button{width:100%;min-height:48px;}
  @media (max-width:640px){
    header{padding:10px 14px;}
    header .sub{display:none;}
    main{padding:16px 12px 40px;}
    .card{padding:16px;}
    .tabs{top:63px;}
    table{display:block;overflow-x:auto;white-space:nowrap;}
  }

  /* Tách rõ từng khối: mỗi hộp có dải tiêu đề nền riêng, các mục con trong hộp có nền nhạt */
  .card:not(.card .card) > h2:first-child,.card:not(.card .card) > .adm-cardhead:first-child{margin:-20px -22px 16px;padding:13px 22px;background:var(--box-head);border-bottom:1.5px solid var(--box);border-radius:16px 16px 0 0;}
  .card:not(.card .card) > h2:first-child,.card:not(.card .card) > .adm-cardhead:first-child h2{color:var(--accent-text);}
  /* Viền màu cho các hộp chính để phân biệt rõ từng phần */
  .card:not(.card .card),.adm-nav,.adm-kpi{border:1.5px solid var(--box);}
  .card .card{background:var(--surface2);}
  .adm-cardhead:first-child h2{margin:0;}
  @media (max-width:640px){ .card:not(.card .card) > h2:first-child,.card:not(.card .card) > .adm-cardhead:first-child{margin:-16px -16px 14px;padding:12px 16px;} }
  /* ---------- Bố cục trang quản trị: cột mục bên trái, nội dung bên phải ---------- */
  body.adm-on main{max-width:1480px;}
  .adm{display:flex;gap:20px;align-items:flex-start;}
  .adm-nav{flex:none;width:232px;position:sticky;top:84px;display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto;}
  .adm-nav-item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;color:var(--text);border-radius:10px;padding:10px 12px;font-weight:600;font-size:.9rem;min-height:42px;}
  .adm-nav-item:hover{background:var(--surface2);}
  .adm-nav-item.on{background:var(--accent-soft);color:var(--accent-text);font-weight:700;}
  .adm-nav-item.add{color:var(--accent-text);}
  .adm-nav-group{padding:10px 12px 2px;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);}
  .adm-nav-sub{display:flex;flex-direction:column;gap:2px;margin-left:10px;padding-left:8px;border-left:2px solid var(--line);}
  .adm-nav-sub .adm-nav-item{font-weight:500;font-size:.86rem;min-height:38px;padding:8px 10px;}
  .adm-nav-sub .adm-nav-item.on{font-weight:700;}
  .adm-badge{flex:none;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line);border-radius:999px;padding:1px 9px;font-size:.72rem;font-weight:700;white-space:nowrap;}
  .adm-main{flex:1;min-width:0;}
  .adm-head{margin:2px 0 14px;}
  .adm-head h2{margin:0;font-size:1.4rem;font-weight:800;}
  .adm-head p{margin:2px 0 0;}
  .adm-crumb{font-size:.82rem;color:var(--muted);}
  .adm-tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:18px;}
  .adm-tab{background:transparent;color:var(--muted);border-radius:0;padding:11px 14px;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;}
  .adm-tab span{font-weight:500;color:var(--faint);}
  .adm-tab:hover{color:var(--text);}
  .adm-tab.on{color:var(--accent-text);border-bottom-color:var(--accent);}
  .adm-tab.on span{color:var(--accent-text);}
  .adm-two{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start;}
  .adm-side{padding:10px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;}
  .adm-list{display:flex;flex-direction:column;gap:3px;}
  .adm-li{display:block;width:100%;text-align:left;background:transparent;color:var(--text);border-radius:10px;padding:9px 11px;font-weight:500;min-height:0;}
  .adm-li b{display:block;font-weight:600;font-size:.88rem;}
  .adm-li span{display:block;font-size:.76rem;color:var(--muted);font-weight:500;}
  .adm-li span.warn,.adm-warn{color:var(--warn);font-weight:600;}
  .adm-li .dbe-nm{display:inline;font-size:inherit;color:inherit;font-weight:inherit;}
  .adm-li:hover{background:var(--surface2);}
  .adm-li.on{background:var(--accent-soft);}
  .adm-li.on b{color:var(--accent-text);}
  .adm-add{width:100%;background:transparent;color:var(--accent-text);border:1px dashed var(--line-strong);margin-top:6px;}
  .adm-add:hover{background:var(--surface2);}
  .adm-cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .adm-cardhead h2{margin:0;}
  .adm-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .adm-step{margin:26px 0 4px;padding:10px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:.95rem;font-weight:800;}
  .adm-adv{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);}
  .adm-adv > summary{cursor:pointer;padding:11px 0;font-weight:600;font-size:.88rem;color:var(--accent-text);}
  .adm-adv[open]{padding-bottom:14px;}
  .adm-fold > summary{cursor:pointer;}
  .adm-search{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .adm-search input[type=text]{flex:1;min-width:240px;}
  .adm-check{display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:500;}
  .adm-rh{margin:16px 0 6px;font-size:.9rem;}
  .adm-results{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .adm-res{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.88rem;}
  .adm-res:last-child{border-bottom:0;}
  .adm-res > div{min-width:0;}
  .adm-res button{flex:none;min-height:36px;padding:6px 12px;}
  .adm-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;}
  .adm-chip{min-height:32px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:.78rem;}
  .adm-chip:hover{background:var(--surface2);}
  .adm-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px;}
  .adm-view > .card,.adm-pane > .card{margin-bottom:20px;}
  .adm-kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;align-items:flex-start;}
  .adm-kpi b{font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums;}
  .adm-kpi span{font-weight:600;font-size:.9rem;}
  .adm-kpi.warn{background:var(--warn-soft);border-color:var(--warn-line);}
  .adm-kpi.warn b{color:var(--warn);}
  .adm-link{background:none;border:0;padding:0;min-height:0;color:var(--accent-text);font-weight:500;font-size:inherit;text-decoration:underline;text-underline-offset:2px;border-radius:4px;}
  .adm-link.strong{font-weight:700;color:var(--text);text-decoration:none;}
  .adm-link.strong:hover{color:var(--accent-text);}
  .adm-log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:.9rem;}
  .adm-diff{margin-top:4px;font-size:.84rem;}
  .adm-diff summary{cursor:pointer;color:var(--accent-text);}
  .adm-diff .old{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--bad-soft);}
  .adm-diff .new{margin-top:4px;padding:8px 10px;border-radius:8px;background:var(--ok-soft);}
  .adm-rename{margin:0 0 14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);}
  .adm-rename label{margin-top:0;}
  .adm-sql{margin-top:10px;padding:12px;border-radius:10px;background:var(--surface2);font-size:.76rem;overflow:auto;max-height:260px;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace !important;font-size:.86rem !important;}
  input.ok{border-color:var(--ok);background:var(--ok-soft);}
  /* Học viên */
  .stu-kpi{cursor:pointer;text-align:left;color:var(--text);min-height:0;font-weight:400;}
  .stu-kpi:hover{border-color:var(--line-strong);}
  .stu-table td{vertical-align:middle;}
  .stu-table td .muted{font-size:.78rem;}
  .stu-table tr.open td{background:var(--accent-soft);}
  .stu-bar{display:inline-block;vertical-align:middle;width:70px;height:7px;border-radius:99px;background:var(--surface2);margin-right:8px;overflow:hidden;}
  .stu-bar i{display:block;height:100%;background:var(--ok);border-radius:99px;}
  .stu-on{color:var(--ok);font-weight:700;}
  .stu-detail td{background:var(--surface2) !important;padding:16px;}
  .stu-dgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;}
  .stu-subj{margin-bottom:10px;}
  .stu-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
  .stu-chip{padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--muted);}
  .stu-chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok);}
  .stu-chip.mid{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn);}
  .stu-recent{list-style:none;margin:6px 0 0;padding:0;font-size:.84rem;}
  .stu-recent li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);}
  .stu-recent li span:last-child{flex:none;color:var(--muted);}
  .adm-chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .honor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}
  .honor-board{border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
  .honor-board h3{margin:0;font-size:1rem;}
  .honor-board p{margin:2px 0 8px;}
  .honor-board ol{list-style:none;margin:0;padding:0;}
  .honor-board li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.88rem;}
  .honor-board .rk{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.76rem;}
  .honor-board li:first-child .rk{background:var(--hi);color:#3A2A00;}
  .honor-board .nm{flex:1;min-width:0;}
  .honor-board .vl{flex:none;font-weight:700;font-variant-numeric:tabular-nums;}
  @media (max-width:900px){ .stu-dgrid{grid-template-columns:1fr;} }
  /* Soạn dạng bài đảo số */
  .dbe-layout{display:grid;grid-template-columns:270px minmax(0,1fr) 330px;gap:16px;align-items:start;}
  .dbe-prev{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;}
  .dbe-topic{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:10px;}
  .dbe-topic:first-child{margin-top:0;}
  .dbe-topic span{display:flex;gap:2px;flex:none;}
  .dbe-tname{background:none;padding:6px 8px;min-height:0;text-align:left;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
  .dbe-tname:hover{color:var(--accent-text);}
  .dbe-var{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--surface2);}
  .dbe-var label{margin:0 0 4px;font-size:.74rem;color:var(--muted);}
  .dbe-var .k{flex:0 0 76px;} .dbe-var .ty{flex:0 0 130px;} .dbe-var .n{flex:0 0 96px;} .dbe-var .wide{flex:1 1 200px;}
  .dbe-calc{display:flex;gap:8px;align-items:center;margin-top:8px;}
  .dbe-calc .k{flex:0 0 90px;} .dbe-calc .f{flex:1;}
  .dbe-ans{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .dbe-ans .f{flex:1 1 260px;} .dbe-ans .u{flex:0 0 150px;} .dbe-ans .n{flex:0 0 80px;}
  .dbe-wrong{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .dbe-wrong .f{flex:1 1 240px;} .dbe-wrong .note{flex:1 1 180px;}
  .dbe-q{font-size:.95rem;line-height:1.6;margin-bottom:10px;}
  .dbe-opt{padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:.9rem;}

async function callRpc(fn, args){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` },

// Chuẩn hoá slug dùng trong đường dẫn upload: bỏ dấu tiếng Việt, đổi khoảng trắng/ký tự lạ thành "-"
function slugify(s){
  return String(s||"")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/đ/g, "d").replace(/Đ/g, "D")
    .trim().toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    || "tam";
}

/* ================= Kho nội dung: sổ tay, dạng bài, cấu hình môn =================
   Hai cách lưu:
   - "server": đã cài hàm lưu trên Supabase (xem Cài đặt) → bấm Lưu là học viên thấy ngay.
   - "file": chưa cài → bấm Lưu sẽ tải file .json về máy để upload lên GitHub (cùng thư mục với portal.html). */
let CONTENT_MODE = "file";
const CFG_DEFAULT = { subjects: {
  "phap-luat":  { sotay: { file: "sotay-luat.json", name: "Sổ tay con số Luật", sub: "Tra nhanh vốn, tỷ lệ %, thời hạn, mức phạt theo chủ điểm và văn bản", ph: "Gõ từ khóa: 24 gio, 5%, chao mua, phat…" } },
  "chuyen-mon": { sotay: { file: "sotay-chuyenmon.json", name: "Sổ tay công thức Chuyên môn", sub: "Tra nhanh công thức và bẫy của từng dạng bài tính", ph: "Gõ từ khóa: gordon, beta, ky quy, npv…" }, dangbai: { file: "dangbai-chuyen-mon.json" } },
  "on-thi-phan-chuyen-mon-cchn": { sotay: { file: "sotay-chuyenmon.json", name: "Sổ tay công thức Chuyên môn", sub: "Tra nhanh công thức và bẫy của từng dạng bài tính", ph: "Gõ từ khóa: gordon, beta, ky quy, npv…" }, dangbai: { file: "dangbai-chuyen-mon.json" } }
} };
let CFG = JSON.parse(JSON.stringify(CFG_DEFAULT));
let cfgDirty = false;
async function contentProbe(){
  try{ const d = await callRpc("get_content_public", { p_key: "cauhinh" }); CONTENT_MODE = (d && d.status) ? "server" : "file"; }
  catch(e){ CONTENT_MODE = "file"; }
}
async function contentGet(key, file){
  if(CONTENT_MODE === "server"){
    try{ const d = await callRpc("get_content_public", { p_key: key }); if(d && d.status === "ok" && d.data) return d.data; }catch(e){}
  }
  if(!file) return null;
  const r = await fetch(file + "?t=" + Date.now(), { cache: "no-store" });
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
function downloadJson(file, data){
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function contentSave(key, data, file){
  if(CONTENT_MODE === "server"){
    try{ const d = await callRpc("admin_save_content", { p_password: PASSWORD, p_key: key, p_data: data }); if(d && d.status === "ok") return { mode: "server", files: [] }; }catch(e){}
  }
  downloadJson(file, data);
  return { mode: "file", files: [file] };
}
/* Lưu nội dung + (nếu có đổi) cấu hình môn, trả về câu thông báo */
async function contentSaveAll(key, data, file){
  const res = await contentSave(key, data, file);
  if(cfgDirty){ const r2 = await contentSave("cauhinh", CFG, "noi-dung.json"); res.files = res.files.concat(r2.files); cfgDirty = false; }
  return res;
}
function contentSavedMsg(res){
  if(res.mode === "server") return `<div class="msg ok">Đã lưu lên hệ thống. Học viên tải lại trang là thấy bản mới.</div>`;
  return `<div class="msg ok">Đã tải về máy: <b>${res.files.map(esc).join("</b>, <b>")}</b>. Bước tiếp: vào GitHub → Add file → Upload files → kéo ${res.files.length > 1 ? "các file" : "file"} này vào (ghi đè bản cũ) → Commit changes. Khoảng 1–2 phút sau học viên thấy bản mới.</div>`;
}
async function cfgLoad(){
  let c = null;
  try{ c = await contentGet("cauhinh", "noi-dung.json"); }catch(e){}
  CFG = (c && c.subjects) ? c : { subjects: {} };
  // môn nào file cấu hình chưa nhắc tới thì dùng cấu hình có sẵn
  const def = JSON.parse(JSON.stringify(CFG_DEFAULT)).subjects;
  Object.keys(def).forEach(k => { if(!(k in CFG.subjects)) CFG.subjects[k] = def[k]; });
}
function cfgOf(slug){ const k = String(slug).toLowerCase(); if(!CFG.subjects[k]) CFG.subjects[k] = {}; return CFG.subjects[k]; }

async function loadSubjects(){

    callRpc("admin_list_subjects", { p_password: PASSWORD }),
    callRpc("admin_list_mock_exam_time_limits", { p_password: PASSWORD }).catch(() => null),
    callRpc("list_subject_hours_public", {}).catch(() => null)
  ]);
  if(!data || data.status !== "ok") return;
  lastLoadedSubjects = data.subjects || [];
  allQuizSlugs = quizSets.map(s => s.slug);
  admTimeLimits = {}; admVideoHours = {};
  if(timeData && timeData.status === "ok") (timeData.items || []).forEach(it => { admTimeLimits[it.slug] = it.mock_exam_time_limit_minutes; });
  if(videoHoursData && videoHoursData.status === "ok") (videoHoursData.items || []).forEach(it => { admVideoHours[it.slug] = it.estimated_hours == null ? null : Number(it.estimated_hours); });
  admRenderNav();
}
async function admUpsertSubject(f){
  return callRpc("admin_upsert_subject", { p_password: PASSWORD, p_slug: f.slug, p_title: f.title, p_description: f.description || "", p_order_index: f.order_index || 0, p_mock_exam_quiz_slug: f.mock_exam_quiz_slug || null, p_mock_exam_count: f.mock_exam_count || 35 });
}
function admNewSubjectSlug(){ const s = document.getElementById("ns-slug"); if(!s.dataset.touched) s.value = slugify(document.getElementById("ns-title").value); }
async function admCreateSubject(){
  const title = document.getElementById("ns-title").value.trim(), desc = document.getElementById("ns-desc").value.trim();
  const slug = slugify(document.getElementById("ns-slug").value || title), msg = document.getElementById("ns-msg");
  if(!title){ msg.innerHTML = `<div class="msg err">Cần nhập tên môn học.</div>`; return; }
  if(lastLoadedSubjects.some(s => s.slug === slug)){ msg.innerHTML = `<div class="msg err">Đã có môn dùng mã “${esc(slug)}”. Mở mục Nâng cao để đặt mã khác.</div>`; return; }
  const order = lastLoadedSubjects.reduce((m, s) => Math.max(m, s.order_index || 0), 0) + 1;
  const data = await admUpsertSubject({ slug, title, description: desc, order_index: order });
  if(!data || data.status !== "ok"){ msg.innerHTML = `<div class="msg err">Lỗi: ${esc(data && data.status)}</div>`; return; }
  const route = document.getElementById("ns-route").value;
  if(route){ cfgOf(slug).lotrinh = route; await contentSave("cauhinh", CFG, "noi-dung.json"); }
  ["ns-title", "ns-desc", "ns-slug", "ns-route"].forEach(id => { const e = document.getElementById(id); e.value = ""; delete e.dataset.touched; });
  msg.innerHTML = "";
  admLog("Thêm môn “" + title + "”", slug);
  await loadSubjects();
  admGo("subject", slug, "lessons");
}
/* Tổng thời lượng video của môn: cộng số phút đã nhập ở từng video; lưu lên hệ thống (theo giờ) để trang học viên hiện trên thẻ môn */
function admVideoMinutes(slug){
  let m = 0;
  (lessonsBySubjectCache[slug] || []).forEach(l => (l.videos || []).forEach(v => { const d = Number(v.duration_seconds) > 0 ? Number(v.duration_seconds) / 60 : parseFloat(String(v.duration_minutes == null ? "" : v.duration_minutes).replace(",", ".")); if(d > 0) m += d; }));
  return Math.round(m * 10) / 10;
}
function admFmtMinutes(m){ return Math.round(m) + " phút"; }
async function admSetHours(slug, hours){
  const d = await callRpc("admin_set_subject_hours", { p_password: PASSWORD, p_subject_slug: slug, p_hours: hours }).catch(() => null);
  if(d && d.status === "ok") admVideoHours[slug] = hours;
  return d;
}
/* Gọi sau khi tải hoặc lưu bài học: nếu tổng phút của các video khác con số đang lưu thì cập nhật */
async function admSyncHours(slug){
  const m = admVideoMinutes(slug);
  if(m <= 0) return;
  const h = Math.round(m / 60 * 1000) / 1000;
  if(admVideoHours[slug] != null && Math.abs(admVideoHours[slug] - h) < 0.002) return;
  await admSetHours(slug, h);
}

async function admSaveInfo(){
  const s = admSubj(), msg = document.getElementById("subj-msg");
  const title = document.getElementById("subj-title").value.trim();
  if(!title){ msg.innerHTML = `<div class="msg err">Cần nhập tên môn học.</div>`; return; }
  const data = await admUpsertSubject({ slug: s.slug, title, description: document.getElementById("subj-desc").value.trim(), order_index: parseInt(document.getElementById("subj-order").value) || 0, mock_exam_quiz_slug: s.mock_exam_quiz_slug, mock_exam_count: s.mock_exam_count });
  if(!data || data.status !== "ok"){ msg.innerHTML = `<div class="msg err">Lỗi: ${esc(data && data.status)}</div>`; return; }
  let extra = "", cfgChanged = false;
  const cfg = cfgOf(s.slug);
  const route = document.getElementById("subj-route").value;
  if(route !== admRouteOf(s.slug)){ cfg.lotrinh = route; cfgChanged = true; }
  if(cfg.sotay){
    const n = document.getElementById("subj-hb-name").value.trim(), sub = document.getElementById("subj-hb-sub").value.trim(), ph = document.getElementById("subj-hb-ph").value.trim();
    if(n !== (cfg.sotay.name || "") || sub !== (cfg.sotay.sub || "") || ph !== (cfg.sotay.ph || "")){
      cfg.sotay.name = n; cfg.sotay.sub = sub; cfg.sotay.ph = ph; cfgChanged = true;
    }
  }
  if(cfgChanged) extra = contentSavedMsg(await contentSave("cauhinh", CFG, "noi-dung.json"));
  if(admVideoMinutes(s.slug) <= 0){
    const raw = document.getElementById("subj-minutes").value.trim().replace(",", "."), mins = raw === "" ? null : parseFloat(raw);
    if(raw !== "" && (isNaN(mins) || mins < 0)){ msg.innerHTML = `<div class="msg err">Tổng thời lượng video phải là số phút, ví dụ 135.</div>`; return; }
    const hours = mins == null ? null : Math.round(mins / 60 * 1000) / 1000;
    if((hours == null) !== (admVideoHours[s.slug] == null) || (hours != null && Math.abs(hours - admVideoHours[s.slug]) > 0.002)) await admSetHours(s.slug, hours);
  }
  admLog("Sửa thông tin môn", s.slug);
  await loadSubjects();
  admRender();
  document.getElementById("subj-msg").innerHTML = `<div class="msg ok">Đã lưu thông tin môn.</div>` + extra;
}

function admLessonStatus(l){
  const set = l.quiz_slug ? quizSets.find(q => q.slug === l.quiz_slug) : null;
  const parts = [], miss = [];
  if((l.videos || []).length) parts.push((l.videos.length > 1 ? l.videos.length + " video" : "Video")); else miss.push("video");
  if(l.mindmap_url) parts.push("Mindmap"); else miss.push("mindmap");
  if((l.documents || []).length) parts.push(l.documents.length + " tài liệu");
  if(set) parts.push(set.question_count + " câu"); else miss.push("câu hỏi");
  return { text: (miss.length ? "Thiếu " + miss.join(", ") + (parts.length ? " · " : "") : "") + parts.join(" · "), warn: miss.length > 0 };
}

function admUsage(){
  const map = {};
  const add = (slug, subj, label) => { if(slug) (map[slug] = map[slug] || []).push({ subj, label }); };
  lastLoadedSubjects.forEach(s => {
    add(s.mock_exam_quiz_slug, s.slug, "Đề thi thử");
    (lessonsBySubjectCache[s.slug] || []).forEach(l => add(l.quiz_slug, s.slug, l.title));
  });
  return map;
}
function admSetsOfSubject(slug){
  const u = admUsage(), out = [];
  quizSets.forEach(set => { const uses = (u[set.slug] || []).filter(x => x.subj === slug); if(uses.length) out.push({ set, label: uses.map(x => x.label).join(", ") }); });
  return out;
}

const ADM_RENAME_SQL = `create or replace function public.admin_rename_quiz_set(p_password text, p_slug text, p_title text)
returns jsonb language plpgsql security definer set search_path = public as $$
begin
  if coalesce((admin_list_quiz_sets(p_password)::jsonb)->>'status','') <> 'ok' then
    return jsonb_build_object('status','unauthorized');
  end if;
  update quiz_sets set title = p_title where slug = p_slug;
  if not found then return jsonb_build_object('status','not_found'); end if;
  return jsonb_build_object('status','ok');
end $$;
grant execute on function public.admin_rename_quiz_set(text, text, text) to anon, authenticated;`;
function admRenameSetOpen(slug){
  const set = quizSets.find(s => s.slug === slug), box = document.getElementById("set-rename");
  if(!set || !box) return;
  box.innerHTML = `<div class="adm-rename">
      <label for="set-rename-input">Tên mới của bộ đề</label>
      <div class="adm-search"><input type="text" id="set-rename-input" value="${esc(set.title)}" onkeydown="if(event.key==='Enter') admRenameSet('${admJs(slug)}')">
        <button class="btn-primary" type="button" onclick="admRenameSet('${admJs(slug)}')">Lưu tên</button>
        <button class="btn-secondary" type="button" onclick="document.getElementById('set-rename').innerHTML=''">Huỷ</button></div>
      <p class="muted">Chỉ đổi tên hiển thị. Câu hỏi, lượt làm bài và chỗ bộ đề đang được gắn vào bài học đều giữ nguyên.</p>
      <div id="set-rename-msg"></div></div>`;
  const i = document.getElementById("set-rename-input"); i.focus(); i.select();
}
async function admRenameSet(slug){
  const set = quizSets.find(s => s.slug === slug), msg = document.getElementById("set-rename-msg");
  const title = document.getElementById("set-rename-input").value.trim();
  if(!set || !msg) return;
  if(!title){ msg.innerHTML = `<div class="msg err">Tên bộ đề không được để trống.</div>`; return; }
  if(title === set.title){ document.getElementById("set-rename").innerHTML = ""; return; }
  msg.innerHTML = `<div class="msg">Đang lưu...</div>`;
  const old = set.title;
  // Thử lần lượt hai hàm trên hệ thống, rồi đọc lại danh sách để chắc chắn tên đã đổi thật
  const tries = [["admin_update_quiz_set", { p_password: PASSWORD, p_slug: slug, p_title: title }], ["admin_rename_quiz_set", { p_password: PASSWORD, p_slug: slug, p_title: title }]];
  let done = false;
  for(const [fn, args] of tries){
    let d = null; try{ d = await callRpc(fn, args); }catch(e){}
    if(d && d.status === "ok"){
      const fresh = await callRpc("admin_list_quiz_sets", { p_password: PASSWORD });
      if(fresh && fresh.status === "ok"){ quizSets = fresh.quiz_sets; if((quizSets.find(s => s.slug === slug) || {}).title === title){ done = true; break; } }
    }
  }
  if(!done){
    msg.innerHTML = `<div class="msg err">Hệ thống hiện chưa có hàm đổi tên bộ đề nên tên chưa đổi.</div>
      <p class="muted">Bật một lần: mở Supabase → SQL Editor → New query, dán đoạn lệnh dưới đây rồi bấm Run. Sau đó quay lại bấm “Lưu tên”.</p>
      <button class="btn-secondary" type="button" onclick="navigator.clipboard.writeText(ADM_RENAME_SQL).then(() => { this.innerText = 'Đã sao chép'; })">Sao chép đoạn lệnh</button>
      <pre class="adm-sql">${esc(ADM_RENAME_SQL)}</pre>`;
    return;
  }
  admLog("Đổi tên bộ đề", admSubjectOfSet(slug) || "", old, title);
  renderSetsTable();
  if(document.getElementById("lessons-table") && lastLoadedLessons.length) admRenderLessonList();
  const lq = document.getElementById("les-quiz");
  if(lq){ const o = Array.from(lq.options).find(x => x.value === slug); if(o) o.text = title + " (" + set.question_count + " câu)"; }
  await openDetail(slug);
  const box = document.getElementById("set-rename"); if(box) box.innerHTML = `<div class="msg ok">Đã đổi tên bộ đề thành “${esc(title)}”.</div>`;
}

async function admQSearch(scope, docKey){
  const all = scope === "all";

  }));

    const rows = admBookHits(q);
    html += `<h3 class="adm-rh">Sổ tay · ${rows.length} dòng</h3>` + (rows.length ? `<div class="adm-results">${rows.slice(0, 60).map(r => `<div class="adm-res"><div><b>${esc(r.row[0] || "")}</b> ${esc(r.row.slice(1).join(" · "))}<div class="muted">${esc(admSubjTitle(r.subj))} · ${esc(r.ch)} · ${esc(r.sec)}</div></div><button class="btn-secondary" type="button" onclick="admGotoBook('${admJs(r.subj)}','${admJs(input.value.trim())}')">Sửa</button></div>`).join("")}</div>` : `<p class="muted">Không có dòng sổ tay nào khớp.</p>`);
    const dr = admDrillHits(q);
    if(dr.length) html += `<h3 class="adm-rh">Dạng bài · ${dr.length}</h3><div class="adm-results">${dr.map(r => `<div class="adm-res"><div><b>${esc(r.name)}</b><div class="muted">${esc(admSubjTitle(r.subj))} · ${esc(r.topic)}</div></div><button class="btn-secondary" type="button" onclick="admGotoDrill('${admJs(r.subj)}',${r.t},${r.d})">Sửa</button></div>`).join("")}</div>`;
  }
  html += `<h3 class="adm-rh">Câu hỏi · ${hits.length} câu${hits.length > 80 ? " (hiện 80 câu đầu, gõ thêm chữ để thu hẹp)" : ""}</h3>` + (hits.length ? `<div class="adm-results">${hits.slice(0, 80).map(h => `<div class="adm-res"><div>${esc(h.q.question)}<div class="muted">${esc(h.set.title)} · câu ${esc(h.q.stt)} · đáp án: ${esc(h.q.correct_answer)}${String(h.q.explanation || "").trim() ? "" : ` · <span class="adm-warn">thiếu lời giải thích</span>`}</div></div><button class="btn-secondary" type="button" onclick="admEditQuestion('${admJs(h.set.slug)}',${h.q.id})">Sửa</button></div>`).join("")}</div>` : `<p class="muted">Không có câu hỏi nào khớp.</p>`);
  out.innerHTML = html;
}

function admBookRows(slug){ const b = admBooks[slug]; if(!b) return cfgOf(slug).sotay ? "" : null; let n = 0; (b.chapters || []).forEach(ch => (ch.sections || []).forEach(s => { n += s.table ? s.table.rows.length : 0; })); return n + " dòng"; }

let dbeTimer = null;
function dbeInput(el){
  const x = dbeCur(); if(!x) return;
  const p = el.dataset.p.split("."), v = el.value;
  const num = s => { const n = parseFloat(String(s).replace(",", ".")); return isNaN(n) ? s : n; };
  if(p[0] === "steps") x.steps = v.split("\n");
  else if(p[0] === "dec") x.dec = Math.max(0, Math.min(6, parseInt(v) || 0));
  else if(p[0] === "vars"){
    const row = x.vars[Number(p[1])], f = p[2];
    if(f === "pick") row.pick = v.split(/[;\n]+/).map(s => s.trim()).filter(Boolean).map(num);
    else if(f === "labels"){ const l = v.split(/[;\n]+/).map(s => s.trim()).filter(Boolean); if(l.length) row.labels = l; else delete row.labels; }
    else if(f === "min" || f === "max" || f === "step") row[f] = num(v.trim());
    else row[f] = f === "k" ? v.trim() : v;
  }
  else if(p[0] === "calc") x.calc[Number(p[1])][p[2]] = p[2] === "k" ? v.trim() : v;
  else if(p[0] === "wrong"){ while(x.wrong.length < 3) x.wrong.push({ f: "", note: "" }); x.wrong[Number(p[1])][p[2]] = v; }
  else x[p[0]] = v;
  if(p[0] === "name"){ const b = document.querySelector("#dbe-root .adm-li.on .dbe-nm"); if(b) b.innerText = v; }
  dbeTouch();
  clearTimeout(dbeTimer); dbeTimer = setTimeout(dbePreview, 350);
}
function dbePreview(){
  const out = document.getElementById("dbe-prev"), x = dbeCur(), E = window.CCHN_DRILL;
  if(!out) return;
  if(!x){ out.innerHTML = ""; return; }
  if(!E){ out.innerHTML = `<div class="msg err">Chưa tải được file dang-bai.js. Cần upload file này cùng thư mục với trang quản trị.</div>`; return; }
  const test = E.selfTest(x, 200), g = E.generate(x);
  const reasons = Object.keys(test.why).map(k => `${test.why[k]} lần ${k}`).join("; ");

    : test.good === test.times ? `<div class="msg ok">Đã thử ${test.times} bộ số: đều ra đề hợp lệ.</div>`

    : `<div class="msg err">Thử ${test.times} bộ số: chỉ ${test.good} bộ dùng được (${esc(reasons)}). Nên xem lại khoảng số hoặc các đáp án sai.</div>`;
  if(!g){ out.innerHTML = health + (test.err ? "" : `<p class="muted">Chưa tạo được đề nào để xem thử.</p>`); return; }

    ${health}
    <p class="muted">Ở trang học viên, 4 đáp án được xáo thứ tự.</p>`;
}

async function dbeSave(){

const ADM_SQL = `create table if not exists public.content_store (
  key text primary key,
  data jsonb not null,
  updated_at timestamptz not null default now()
);
alter table public.content_store enable row level security;

create or replace function public.get_content_public(p_key text)
returns jsonb language sql security definer set search_path = public as $$
  select coalesce(
    (select jsonb_build_object('status','ok','data',data,'updated_at',updated_at) from content_store where key = p_key),
    jsonb_build_object('status','not_found'));
$$;

create or replace function public.admin_save_content(p_password text, p_key text, p_data jsonb)
returns jsonb language plpgsql security definer set search_path = public as $$
begin
  if coalesce((admin_list_subjects(p_password)::jsonb)->>'status','') <> 'ok' then
    return jsonb_build_object('status','unauthorized');
  end if;
  insert into content_store(key, data) values (p_key, p_data)
  on conflict (key) do update set data = excluded.data, updated_at = now();
  return jsonb_build_object('status','ok');
end $$;

grant execute on function public.get_content_public(text) to anon, authenticated;
grant execute on function public.admin_save_content(text, text, jsonb) to anon, authenticated;`;

/* ================= Soạn sổ tay con số Luật =================
   Dữ liệu: file sotay-luat.json đặt cạnh portal.html. Trang này đọc file đó, cho sửa,
   rồi tải về file mới để upload đè lên GitHub. Bản nháp lưu trong localStorage của máy đang dùng. */
let hbe = { data: null, cur: 0, q: "", dirty: false, source: "" };
function hbeClone(o){ return JSON.parse(JSON.stringify(o)); }
function hbeFold(t){ return String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase(); }
function hbeNormalize(d){
  d = d || {};
  d.title = d.title || "Sổ tay";
  d.docs = Array.isArray(d.docs) ? d.docs : [];
  d.chapters = Array.isArray(d.chapters) ? d.chapters : [];
  d.chapters.forEach(ch => {
    ch.id = ch.id || hbeNewId(ch.title, d);
    ch.summary = ch.summary || "";
    ch.sections = Array.isArray(ch.sections) ? ch.sections : [];
    ch.sections.forEach(sec => {
      sec.title = sec.title || ""; sec.docs = sec.docs || []; sec.notes = sec.notes || [];
      if(sec.table && (!sec.table.head || !sec.table.head.length)) sec.table.head = ["Nội dung", "Quy định"];
    });
  });
  return d;
}
function hbeNewId(title, d){
  const base = hbeFold(title).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30) || "chu-diem";
  let id = base, n = 2; const ids = new Set(((d || hbe.data || {}).chapters || []).map(c => c.id));
  while(ids.has(id)) id = base + "-" + (n++);
  return id;
}
function hbeSaveDraft(downloaded){
  hbe.dirty = !downloaded;
  try{ localStorage.setItem(HBE_DRAFT, JSON.stringify({ at: Date.now(), data: hbe.data, downloaded: !!downloaded })); }catch(e){}
  hbeRenderStatus();
}
function hbeReadDraft(){ try{ return JSON.parse(localStorage.getItem(HBE_DRAFT) || "null"); }catch(e){ return null; } }
function hbeClearDraft(){ try{ localStorage.removeItem(HBE_DRAFT); }catch(e){} hbe.dirty = false; }
async function hbeInit(){
  const draft = hbeReadDraft();
  if(draft && draft.data){
    hbe.data = hbeNormalize(draft.data); hbe.dirty = !draft.downloaded; hbe.source = "Bản sửa trên máy này";
    const when = new Date(draft.at).toLocaleString("vi-VN");
    document.getElementById("hbe-draft").innerHTML = draft.downloaded
      ? `<div class="hbe-draft">Đang mở bản bạn đã tải về lúc ${when}. Nếu đã upload lên GitHub rồi thì có thể mở bản trên web. <button class="btn-secondary hbe-mini" type="button" onclick="hbeLoadFromWeb(false)">Mở bản trên web</button></div>`
      : `<div class="hbe-draft">Đang mở bản bạn sửa dở lúc ${when} (chưa tải về). <button class="btn-secondary hbe-mini" type="button" onclick="hbeLoadFromWeb(true)">Bỏ chỗ sửa, mở bản trên web</button></div>`;
    hbeRender();
    return;
  }
  await hbeLoadFromWeb(false);
}
function hbeOpenFile(input){
  const f = input.files && input.files[0]; input.value = "";
  if(!f) return;
  if(hbe.dirty && !confirm("Mở file này sẽ thay bản đang sửa. Tiếp tục?")) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if(!d || !Array.isArray(d.chapters)) throw new Error("sai cấu trúc");
      hbe.data = hbeNormalize(d); hbe.cur = 0; hbe.source = "File " + f.name;
      hbeSaveDraft(); document.getElementById("hbe-draft").innerHTML = ""; hbeRender();
    }catch(e){ alert("File này không phải file sổ tay hợp lệ ."); }
  };
  rd.readAsText(f, "utf-8");
}
function hbeCounts(){
  const d = hbe.data; let rows = 0;
  d.chapters.forEach(ch => ch.sections.forEach(s => { rows += s.table ? s.table.rows.length : 0; }));
  return { ch: d.chapters.length, rows };
}
function hbeRenderStatus(){
  const el = document.getElementById("hbe-status"); if(!el || !hbe.data) return;
  const c = hbeCounts();
  el.innerHTML = `<b>${c.ch}</b> chủ điểm · <b>${c.rows}</b> dòng · nguồn: ${esc(hbe.source)}${hbe.dirty ? ` · <span style="color:var(--warn);font-weight:700;">Có thay đổi chưa tải về</span>` : ""}`;
}
function hbeChapterHit(ch){
  const fq = hbeFold(hbe.q); if(!fq) return false;
  return hbeFold(JSON.stringify(ch)).includes(fq);
}
function hbeRender(){ hbeRenderStatus(); hbeRenderList(); hbeRenderEditor(); }
function hbeRenderList(){

  }).join("") + `<button type="button" class="btn-secondary hbe-mini" style="margin-top:6px;" onclick="hbeAddChapter()">+ Thêm chủ điểm</button>

}
function hbeGo(i){ hbe.cur = i; hbe.docsMode = false; hbeRenderList(); hbeRenderEditor(); document.getElementById("hbe-editor").scrollIntoView({ behavior: "smooth", block: "start" }); }
function hbeTa(val, path, ph, hit){ return `<textarea rows="1" data-p="${path}" placeholder="${esc(ph || "")}" oninput="hbeInput(this)">${esc(val)}</textarea>`; }
function hbeRenderEditor(){

    </div>
    <label>Nhớ nhanh (câu mẹo nhớ hiện đầu chủ điểm)</label>
    ${hbeTa(ch.summary, `c.${c}.summary`, "VD: Họp trên 50% → từ 33% → không cần tỷ lệ")}
    ${ch.sections.map((sec, si) => {
      const head = sec.table ? sec.table.head : ["Nội dung", "Quy định"];
      return `<div class="hbe-sec">
        <div class="hbe-sec-head">
          <input type="text" data-p="c.${c}.s.${si}.title" value="${esc(sec.title)}" oninput="hbeInput(this)" placeholder="Tên mục" aria-label="Tên mục">

          <button class="btn-secondary hbe-mini" type="button" title="Chuyển mục xuống" onclick="hbeMoveSec(${si},1)">↓</button>
          <button class="btn-danger hbe-mini" type="button" onclick="hbeDelSec(${si})">Xoá mục</button>
        </div>
        <div class="hbe-docs" aria-label="Văn bản quy định">${d.docs.map(x => `<button type="button" class="hbe-doc ${sec.docs.includes(x.key) ? "on" : ""}" title="${esc(x.full || "")}" onclick="hbeToggleDoc(${si},'${esc(x.key)}')">${esc(x.label)}</button>`).join("") || `<span class="muted">Chưa có văn bản nào trong danh sách.</span>`}</div>
        <table class="hbe-table">
          <thead><tr>${head.map((h, hi) => `<th><input type="text" data-p="c.${c}.s.${si}.h.${hi}" value="${esc(h)}" oninput="hbeInput(this)" aria-label="Tiêu đề cột ${hi + 1}"></th>`).join("")}<th></th></tr></thead>
          <tbody>${(sec.table ? sec.table.rows : []).map((r, ri) => `<tr class="${hit(r.join(" ")) ? "hit" : ""}">${head.map((_, ci) => `<td>${hbeTa(r[ci] || "", `c.${c}.s.${si}.r.${ri}.${ci}`, head[ci])}</td>`).join("")}
            <td class="act"><button class="btn-secondary" type="button" title="Lên" onclick="hbeMoveRow(${si},${ri},-1)">↑</button><button class="btn-secondary" type="button" title="Xuống" onclick="hbeMoveRow(${si},${ri},1)">↓</button><button class="btn-danger" type="button" title="Xoá dòng" onclick="hbeDelRow(${si},${ri})">✕</button></td></tr>`).join("")}</tbody>
        </table>

        </div>

          <div class="muted" style="display:block;margin-top:10px;">Ghi chú dưới bảng (mỗi ô là một gạch đầu dòng)</div>
          ${sec.notes.map((n, ni) => `<div class="${hit(n) ? "hit" : ""}">${hbeTa(n, `c.${c}.s.${si}.n.${ni}`, "Ghi chú")}<button class="btn-danger hbe-mini" type="button" title="Xoá ghi chú" onclick="hbeDelNote(${si},${ni})">✕</button></div>`).join("")}
          <div class="hbe-add"><button class="btn-secondary hbe-mini" type="button" onclick="hbeAddNote(${si})">+ Thêm ghi chú</button></div>

    <div class="hbe-add" style="margin-top:14px;"><button class="btn-secondary" type="button" onclick="hbeAddSec()">+ Thêm mục vào chủ điểm này</button></div>
  </div>`;
  hbeAutosize(el);

function hbeAutosize(root){ root.querySelectorAll("textarea").forEach(t => { t.style.height = "auto"; t.style.height = Math.max(40, t.scrollHeight + 2) + "px"; }); }
let hbeSaveTimer = null;
function hbeInput(el){
  const p = el.dataset.p.split("."), d = hbe.data, v = el.value;
  const ch = d.chapters[+p[1]];
  if(p[2] === "title") ch.title = v;
  else if(p[2] === "summary") ch.summary = v;
  else if(p[2] === "s"){
    const sec = ch.sections[+p[3]];
    if(p[4] === "title") sec.title = v;
    else if(p[4] === "h") sec.table.head[+p[5]] = v;
    else if(p[4] === "r") sec.table.rows[+p[5]][+p[6]] = v;
    else if(p[4] === "n") sec.notes[+p[5]] = v;
  } else if(p[0] === "d"){ d.docs[+p[1]][p[2]] = v; }
  if(el.tagName === "TEXTAREA"){ el.style.height = "auto"; el.style.height = Math.max(40, el.scrollHeight + 2) + "px"; }
  clearTimeout(hbeSaveTimer); hbeSaveTimer = setTimeout(() => { hbeSaveDraft(); if(p[2] === "title") hbeRenderList(); }, 300);
}
function hbeCh(){ return hbe.data.chapters[hbe.cur]; }
function hbeChanged(){ hbeSaveDraft(); hbeRender(); }
function hbeSwap(arr, i, j){ if(j < 0 || j >= arr.length) return false; [arr[i], arr[j]] = [arr[j], arr[i]]; return true; }
function hbeAddChapter(){
  const t = prompt("Tên chủ điểm mới:", ""); if(!t) return;
  hbe.data.chapters.push({ id: hbeNewId(t), title: t, summary: "", sections: [{ title: "", docs: [], notes: [], table: { head: ["Nội dung", "Quy định"], rows: [["", ""]] } }] });
  hbe.cur = hbe.data.chapters.length - 1; hbe.docsMode = false; hbeChanged();
}
function hbeDelChapter(){ const ch = hbeCh(); if(!confirm(`Xoá cả chủ điểm “${ch.title}”?`)) return; hbe.data.chapters.splice(hbe.cur, 1); hbe.cur = Math.max(0, hbe.cur - 1); hbeChanged(); }

function hbeAddSec(){ hbeCh().sections.push({ title: "", docs: [], notes: [], table: { head: ["Nội dung", "Quy định"], rows: [["", ""]] } }); hbeChanged(); }

function hbeAddDoc(){
  const label = prompt("Tên ngắn của văn bản (VD: TT 96):", ""); if(!label) return;
  let key = hbeFold(label).replace(/[^a-z0-9]+/g, ""), n = 2; const keys = new Set(hbe.data.docs.map(x => x.key));
  if(!key) key = "vb"; const base = key; while(keys.has(key)) key = base + (n++);
  hbe.data.docs.push({ key, label, full: "" }); hbeSaveDraft(); hbeRenderDocs();
}
function hbeDelDoc(i){
  const x = hbe.data.docs[i]; if(!confirm(`Xoá văn bản “${x.label}”? Các mục đang gắn văn bản này sẽ bỏ nhãn.`)) return;
  hbe.data.docs.splice(i, 1);
  hbe.data.chapters.forEach(ch => ch.sections.forEach(s => { s.docs = s.docs.filter(k => k !== x.key); }));
  hbeSaveDraft(); hbeRenderDocs();
}

/* Làm sạch trước khi tải về: bỏ dòng trống, ghi chú trống, mục trống */
function hbeCleanCopy(){
  const d = hbeClone(hbe.data), warn = [];
  d.chapters.forEach(ch => {
    if(!String(ch.title).trim()) warn.push("Có chủ điểm chưa đặt tên.");
    ch.sections = ch.sections.map(s => {
      s.notes = s.notes.map(n => String(n).trim()).filter(Boolean);
      if(s.table){
        s.table.rows = s.table.rows.map(r => r.map(c => String(c || "").trim())).filter(r => r.some(Boolean));
        if(!s.table.rows.length) s.table = null;
      }
      return s;
    }).filter(s => s.table || s.notes.length);
  });
  const now = new Date(); d.updated = String(now.getMonth() + 1).padStart(2, "0") + "/" + now.getFullYear();
  return { d, warn };
}
function hbePreview(){
  const { d } = hbeCleanCopy(); const ch = d.chapters.find(c => c.id === (hbeCh() || {}).id) || d.chapters[0];

    ${ch.sections.map(s => `<h3 style="margin:18px 0 6px;font-size:.98rem;">${esc(s.title)} ${s.docs.map(k => `<span class="pill">${esc(doc(k))}</span>`).join(" ")}</h3>
      ${s.table ? `<table><tr>${s.table.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>${s.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>` : ""}
      ${s.notes.length ? `<ul>${s.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}`).join("")}
  </div>`;
  document.body.appendChild(box);
}

function renderVideosList(){

      <input type="text" value="${v.duration_seconds ? formatMinutes(v.duration_seconds/60) : ""}" placeholder="số phút" title="Thời lượng video (phút)" aria-label="Thời lượng video (phút)" style="width:86px;flex:none;margin:0;" onchange="setVideoMinutes(${i}, this.value)"><span class="muted" style="flex:none;font-size:.82rem;">phút</span>
      <button class="btn-danger" type="button" onclick="removeVideo(${i})">Xoá</button>
    </div>
  `).join("");
}
function setVideoMinutes(i, raw){
  const m = parseFloat(String(raw || "").trim().replace(",", "."));
  if(currentLessonVideos[i]) currentLessonVideos[i].duration_seconds = (!isNaN(m) && m > 0) ? Math.round(m * 60) : null;
}
function removeVideo(i){ currentLessonVideos.splice(i,1); renderVideosList(); }

function formatMinutes(m){
  return (Math.round(m*10)/10).toLocaleString("vi-VN");
}

function readVideoDuration(file){
  return new Promise((resolve) => {
    try{
      const videoEl = document.createElement("video");
      videoEl.preload = "metadata";
      videoEl.onloadedmetadata = () => {
        URL.revokeObjectURL(videoEl.src);
        resolve(isFinite(videoEl.duration) ? videoEl.duration : null);
      };
      videoEl.onerror = () => resolve(null);
      videoEl.src = URL.createObjectURL(file);
    } catch(e){ resolve(null); }
  });
}

function addVideoLink(){
  const labelEl = document.getElementById("les-video-label");
  const urlEl = document.getElementById("les-video-url");
  const durationEl = document.getElementById("les-video-duration");
  const msgEl = document.getElementById("les-video-msg");
  const label = labelEl.value.trim();
  const url = urlEl.value.trim();
  const durationMin = parseFloat((durationEl.value||"").trim().replace(",", "."));
  const duration_seconds = (!isNaN(durationMin) && durationMin > 0) ? Math.round(durationMin * 60) : null;
  if(!label || !url){ msgEl.innerHTML = `<div class="msg err">Nhập tên video và dán link trước.</div>`; return; }
  currentLessonVideos.push({ label, url, duration_seconds });
  renderVideosList();
  labelEl.value = ""; urlEl.value = ""; durationEl.value = "";
  msgEl.innerHTML = `<div class="msg ok">Đã thêm "${esc(label)}".</div>`;
}

async function uploadVideoFile(){
  const labelEl = document.getElementById("les-video-label");
  const fileEl = document.getElementById("les-video-file");
  const msgEl = document.getElementById("les-video-msg");
  const label = labelEl.value.trim();

  msgEl.innerHTML = `<div class="msg">Đang tải video lên, có thể mất một lúc...</div>`;
  try{

    const safeName = file.name.replace(/[^\w.\-]/g, "_");
    const path = `${slugify(currentSubjectSlug)}/${lessonSlug}/video-${Date.now()}-${safeName}`;

  }
}

async function uploadToStorage(file, path){
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/lesson-files/${path}`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": file.type || "application/octet-stream",
      "x-upsert": "true"
    },
    body: file
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(`HTTP ${res.status}: ${t}`);
  }
  return `${SUPABASE_URL}/storage/v1/object/public/lesson-files/${path}`;
}

/* ---------- Lưu một câu luyện theo dạng ----------
   Hệ thống (Supabase) hiện lưu câu luyện theo dạng kiểu "điền đáp số": đáp số là một con số + đơn vị + sai số cho phép.
   Trang này soạn theo kiểu 4 lựa chọn A/B/C/D. Khi lưu: thử kiểu 4 lựa chọn trước; nếu hệ thống chưa hỗ trợ thì tự đổi
   sang kiểu điền đáp số bằng cách lấy con số và đơn vị từ lựa chọn đúng. */
let calcMcqSupported = null; // null = chưa biết
function calcParseAnswer(text){
  const m = String(text || "").trim().replace(/−/g, "-").match(/^(-?)\s*(\d[\d.]*(?:,\d+)?)\s*(.*)$/);
  if(!m) return null;
  let num = m[2], dec = 0;
  if(num.indexOf(",") >= 0){ dec = num.split(",")[1].length; num = num.replace(/\./g, "").replace(",", "."); }
  else if(/^\d{1,3}(\.\d{3})+$/.test(num)) num = num.replace(/\./g, "");
  else if(num.indexOf(".") >= 0) dec = num.split(".")[1].length;
  const v = parseFloat(num);
  if(isNaN(v)) return null;
  const unit = m[3].trim();
  if(/\d/.test(unit)) return null; // còn con số khác trong phần chữ: đây là câu trả lời bằng chữ, không phải một đáp số
  const value = (m[1] ? -1 : 1) * v;
  const tol = Math.max(Math.pow(10, -dec), Math.abs(value) * 0.005);
  return { value, unit, dec, tolerance: Number(tol.toPrecision(2)) };
}
async function calcSaveItem(it){
  const base = { p_password: PASSWORD, p_group_id: it.groupId, p_id: it.id || null, p_item_type: it.itemType, p_order_index: it.order, p_question: it.question, p_solution_steps: it.solution || null };
  if(calcMcqSupported !== false){
    const d = await callRpc("admin_upsert_calc_practice_item", Object.assign({}, base, { p_option_a: it.optionA, p_option_b: it.optionB, p_option_c: it.optionC, p_option_d: it.optionD, p_correct_option: it.correctOption }));
    if(d && d.status === "ok"){ calcMcqSupported = true; return d; }
    if(!(d && d.code === "PGRST202")) return d;
    calcMcqSupported = false;
  }
  const ans = calcParseAnswer(it["option" + it.correctOption]);
  if(!ans) return { status: "text_answer", message: "đáp án là chữ, không phải một con số nên chưa lưu được ở kiểu điền đáp số" };
  const q = it.question.replace(/\s*(là)?\s*[:?]?\s*$/, m => m) + `\n(Tự tính rồi nhập đáp số${ans.unit ? ", đơn vị: " + ans.unit : ""}${ans.dec ? ", làm tròn " + ans.dec + " số lẻ" : ""}.)`;
  return callRpc("admin_upsert_calc_practice_item", Object.assign({}, base, { p_question: q, p_correct_value: ans.value, p_tolerance: ans.tolerance, p_unit: ans.unit || null }));
}

/* ---------- Nhập hàng loạt "Luyện tính toán chuyên sâu" từ file Excel ---------- */
// Cấu trúc 15 cột (dòng đầu là tiêu đề, sẽ tự bỏ qua):
// 0 Phần | 1 Thứ tự phần | 2 Video phần (link) | 3 Tên video phần |
// 4 Dạng | 5 Thứ tự dạng | 6 Loại câu (Mẫu/Bài tập) | 7 Thứ tự câu |
// 8 Câu hỏi | 9 Đáp án A | 10 Đáp án B | 11 Đáp án C | 12 Đáp án D |
// 13 Đáp án đúng (A/B/C/D) | 14 Lời giải chi tiết
async function importCalcPracticeExcel(){
  const fileInput = document.getElementById("calc-excel-file");
  const msgEl = document.getElementById("calc-import-msg");
  const file = fileInput && fileInput.files && fileInput.files[0];
  if(!file){
    msgEl.innerHTML = `<div class="msg err">Vui lòng chọn 1 file Excel (.xlsx/.xls/.csv) trước.</div>`;
    return;
  }
  msgEl.innerHTML = `<div class="muted">Đang đọc file...</div>`;

  let rows;
  try{
    rows = await readExcelFile(file);
  } catch(err){
    msgEl.innerHTML = `<div class="msg err">Không đọc được file: ${esc(err && err.message)}</div>`;
    return;
  }

  // Bỏ dòng tiêu đề (dòng đầu) nếu cột "Phần" của nó không phải dữ liệu thật
  // (chấp nhận luôn: coi dòng đầu là tiêu đề, bỏ qua).
  const dataRows = rows.slice(1);

  const parsed = [];
  const rowErrors = [];
  dataRows.forEach((r, idx) => {
    const rowNum = idx + 2; // số dòng thật trong Excel (tính cả dòng tiêu đề)
    const sectionTitle = String(r[0] || "").trim();
    const sectionOrder = parseInt(r[1]) || 0;
    const sectionVideoUrl = String(r[2] || "").trim();
    const sectionVideoLabel = String(r[3] || "").trim();
    const groupTitle = String(r[4] || "").trim();
    const groupOrder = parseInt(r[5] || "") || 0;
    const typeRaw = normalizeAnswerText(r[6] || "");
    const itemOrder = parseInt(r[7] || "") || 0;
    const question = String(r[8] || "").trim();
    const optionA = String(r[9] || "").trim();
    const optionB = String(r[10] || "").trim();
    const optionC = String(r[11] || "").trim();
    const optionD = String(r[12] || "").trim();
    const correctOptionRaw = String(r[13] || "").trim().toUpperCase().replace(/[^A-D]/g, "");
    const solution = String(r[14] || "").trim();

    // Bỏ qua hàng trống hoàn toàn
    if(!sectionTitle && !groupTitle && !question) return;

    if(!sectionTitle || !groupTitle || !question){
      rowErrors.push(`Dòng ${rowNum}: thiếu "Phần"/"Dạng"/"Câu hỏi" — đã bỏ qua.`);
      return;
    }
    if(!optionA || !optionB || !optionC || !optionD){
      rowErrors.push(`Dòng ${rowNum}: thiếu 1 trong 4 đáp án A/B/C/D — đã bỏ qua.`);
      return;
    }
    if(!["A","B","C","D"].includes(correctOptionRaw)){
      rowErrors.push(`Dòng ${rowNum}: "Đáp án đúng" phải là A, B, C hoặc D — đã bỏ qua.`);
      return;
    }
    const itemType = (typeRaw === "mẫu" || typeRaw === "mau" || typeRaw === "sample") ? "sample" : "practice";

    parsed.push({
      rowNum, sectionTitle, sectionOrder, sectionVideoUrl, sectionVideoLabel,
      groupTitle, groupOrder, itemType, itemOrder, question,
      optionA, optionB, optionC, optionD, correctOption: correctOptionRaw, solution
    });
  });

  if(parsed.length === 0){
    msgEl.innerHTML = `<div class="msg err">Không có dòng hợp lệ nào để nhập.${rowErrors.length ? "<br>" + rowErrors.map(esc).join("<br>") : ""}</div>`;
    return;
  }

  msgEl.innerHTML = `<div class="muted">Đang tạo/khớp các phần...</div>`;

  // --- Bước 1: tạo/khớp "Phần" theo tên (khớp với phần đã có sẵn, hoặc phần vừa tạo trong lượt import này) ---
  const sectionIdByTitle = {}; // title (chuẩn hoá) -> id
  (currentCalcSections || []).forEach(s => {
    if(s.id !== null) sectionIdByTitle[normalizeAnswerText(s.title)] = s.id;
  });
  const sectionOrderCache = {}; // title chuẩn hoá -> thông tin phần trong file (để biết order/video cần lưu khi tạo mới)
  parsed.forEach(p => {
    const key = normalizeAnswerText(p.sectionTitle);
    if(!sectionOrderCache[key]) sectionOrderCache[key] = p;
  });

  let sectionsCreated = 0;
  for(const key of Object.keys(sectionOrderCache)){
    if(sectionIdByTitle[key] !== undefined) continue; // đã có sẵn, không tạo mới
    const info = sectionOrderCache[key];
    const data = await callRpc("admin_upsert_calc_practice_section", {
      p_password: PASSWORD, p_subject_slug: currentSubjectSlug, p_title: info.sectionTitle,
      p_id: null, p_order_index: info.sectionOrder,
      p_video_url: info.sectionVideoUrl || null, p_video_label: info.sectionVideoLabel || null
    });
    if(data && data.status === "ok"){
      sectionIdByTitle[key] = data.id;
      sectionsCreated++;
    } else {
      rowErrors.push(`Không tạo được phần "${info.sectionTitle}": ${esc(data && data.status)}`);
    }
  }

  msgEl.innerHTML = `<div class="muted">Đang tạo/khớp các dạng...</div>`;

  // --- Bước 2: tạo/khớp "Dạng" theo (phần, tên dạng) ---
  const groupIdByKey = {}; // `${sectionId}::${titleChuanHoa}` -> id
  (currentCalcSections || []).forEach(s => {
    (s.groups || []).forEach(g => {
      groupIdByKey[`${s.id}::${normalizeAnswerText(g.title)}`] = g.id;
    });
  });
  const groupInfoCache = {};
  parsed.forEach(p => {
    const sid = sectionIdByTitle[normalizeAnswerText(p.sectionTitle)];
    const gkey = `${sid}::${normalizeAnswerText(p.groupTitle)}`;
    if(!groupInfoCache[gkey]) groupInfoCache[gkey] = { sectionId: sid, title: p.groupTitle, order: p.groupOrder };
  });

  let groupsCreated = 0;
  for(const gkey of Object.keys(groupInfoCache)){
    if(groupIdByKey[gkey] !== undefined) continue;
    const info = groupInfoCache[gkey];
    if(info.sectionId === undefined || info.sectionId === null){
      rowErrors.push(`Không xác định được phần cho dạng "${info.title}" — đã bỏ qua các câu thuộc dạng này.`);
      continue;
    }
    const data = await callRpc("admin_upsert_calc_practice_group", {
      p_password: PASSWORD, p_subject_slug: currentSubjectSlug, p_title: info.title,
      p_id: null, p_section_id: info.sectionId, p_order_index: info.order
    });
    if(data && data.status === "ok"){
      groupIdByKey[gkey] = data.id;
      groupsCreated++;
    } else {
      rowErrors.push(`Không tạo được dạng "${info.title}": ${esc(data && data.status)}`);
    }
  }

  msgEl.innerHTML = `<div class="muted">Đang nhập các câu hỏi...</div>`;

  // --- Bước 3: nhập các câu, mỗi lúc chỉ gửi vài câu (gửi cả trăm câu cùng lúc làm máy chủ quá tải và từ chối hết) ---
  let itemsOk = 0, itemsSkipped = 0, itemsDone = 0, itemsText = 0;
  const itemOrderCounter = {}; // groupId -> số thứ tự tiếp theo (nếu file không ghi thứ tự câu)
  // Câu đã có sẵn trong dạng (trùng nội dung câu hỏi) thì bỏ qua, để nhập lại file không bị nhân đôi
  const existing = {};
  (currentCalcSections || []).forEach(s => (s.groups || []).forEach(g => (g.items || []).forEach(it => { existing[g.id + "::" + normalizeAnswerText(String(it.question || "").split("\n(Tự tính rồi nhập đáp số")[0])] = 1; })));
  const errText = d => !d ? "không nhận được phản hồi" : (d.message || d.hint || d.details || d.status || d.code || "lỗi không rõ");
  const queue = parsed.slice();
  async function worker(){
    while(queue.length){
      const p = queue.shift();
      const sid = sectionIdByTitle[normalizeAnswerText(p.sectionTitle)];
      const groupId = groupIdByKey[`${sid}::${normalizeAnswerText(p.groupTitle)}`];
      if(groupId === undefined || groupId === null){
        rowErrors.push(`Dòng ${p.rowNum}: không xác định được dạng cho câu này — đã bỏ qua.`);
      } else if(existing[groupId + "::" + normalizeAnswerText(p.question)]){
        itemsSkipped++;
      } else {
        let order = p.itemOrder;
        if(!order){ itemOrderCounter[groupId] = (itemOrderCounter[groupId] || 0) + 1; order = itemOrderCounter[groupId]; }
        let data = null;
        for(let attempt = 0; attempt < 3; attempt++){
          try{
            data = await calcSaveItem({ groupId, id: null, itemType: p.itemType, order, question: p.question, optionA: p.optionA, optionB: p.optionB, optionC: p.optionC, optionD: p.optionD, correctOption: p.correctOption, solution: p.solution });
          }catch(e){ data = { message: e && e.message }; }
          if(data && (data.status === "ok" || data.status === "text_answer")) break;
          await new Promise(r => setTimeout(r, 600 * (attempt + 1)));
        }
        if(data && data.status === "ok"){ itemsOk++; existing[groupId + "::" + normalizeAnswerText(p.question)] = 1; }
        else if(data && data.status === "text_answer") itemsText++;
        else rowErrors.push(`Dòng ${p.rowNum}: chưa lưu được câu hỏi (${errText(data)}).`);
      }
      itemsDone++;
      if(itemsDone % 5 === 0 || itemsDone === parsed.length){ const m = document.getElementById("calc-import-msg"); if(m) m.innerHTML = `<div class="muted">Đang nhập câu hỏi: ${itemsDone}/${parsed.length}. Vui lòng giữ nguyên trang này...</div>`; }
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  rowErrors.sort((x, y) => (parseInt((x.match(/Dòng (\d+)/) || [])[1]) || 0) - (parseInt((y.match(/Dòng (\d+)/) || [])[1]) || 0));

  const summary = `Đã nhập ${itemsOk}/${parsed.length} câu${itemsSkipped ? `, bỏ qua ${itemsSkipped} câu đã có sẵn` : ""}${itemsText ? `, ${itemsText} câu có đáp án bằng chữ chưa nhập được` : ""}${calcMcqSupported === false ? " (lưu theo kiểu học viên tự tính và điền đáp số)" : ""}, tạo mới ${sectionsCreated} phần và ${groupsCreated} dạng (các phần/dạng trùng tên đã có sẵn được tự gộp chung).`;
  const errHtml = rowErrors.length ? `<div class="msg err" style="margin-top:6px;">${rowErrors.length > 12 ? `Có ${rowErrors.length} dòng chưa nhập được. Bạn có thể bấm “Nhập từ Excel” lại với đúng file này: các câu đã vào sẽ tự được bỏ qua.<br>` : ""}${rowErrors.slice(0, 12).map(esc).join("<br>")}${rowErrors.length > 12 ? "<br>…" : ""}</div>` : "";
  const resultHtml = `<div class="msg ok">${esc(summary)}</div>${errHtml}`;

  // loadCalcPractice() sẽ render lại toàn bộ khung (kể cả khu vực nhập Excel),
  // nên phải lưu kết quả lại và gán vào đúng div #calc-import-msg MỚI sau khi render lại,
  // vì tham chiếu msgEl cũ sẽ bị huỷ khi innerHTML của cha nó được thay thế.
  await loadCalcPractice(currentSubjectSlug);
  const newMsgEl = document.getElementById("calc-import-msg");
  if(newMsgEl) newMsgEl.innerHTML = resultHtml;
}
