function fmtDT(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString("vi-VN");
}

// Hiện "x phút trước" / "x giờ trước" / "x ngày trước" cho dễ nhìn thay vì ngày giờ đầy đủ.
function fmtRelative(iso){
  if(!iso) return "—";
  const then = new Date(iso).getTime();
  const diffSec = Math.max(0, Math.floor((Date.now() - then) / 1000));
  if(diffSec < 60) return "Vừa xong";
  const diffMin = Math.floor(diffSec / 60);
  if(diffMin < 60) return `${diffMin} phút trước`;
  const diffHour = Math.floor(diffMin / 60);
  if(diffHour < 24) return `${diffHour} giờ trước`;
  const diffDay = Math.floor(diffHour / 24);
  if(diffDay < 30) return `${diffDay} ngày trước`;
  return new Date(iso).toLocaleDateString("vi-VN");
}

const STATUS_LABEL = {
  none: { text: "Chưa yêu cầu", bg: "var(--surface2)", fg: "var(--muted)" },
  pending: { text: "⏳ Chờ duyệt", bg: "var(--warn-soft)", fg: "var(--warn)" },
  approved: { text: "✅ Đã duyệt", bg: "var(--ok-soft)", fg: "var(--green)" },
  rejected: { text: "❌ Từ chối", bg: "var(--bad-soft)", fg: "var(--red)" }
};

/* ================= Học viên: tình hình học và bảng vinh danh =================
   Nguồn số liệu: danh sách học viên + lượt làm bài của mọi bộ đề. Lượt làm bài ghi theo họ tên,
   nên học viên được ghép với lượt làm bài bằng họ tên (hai người trùng tên sẽ bị gộp số liệu). */
const STU_PASS = 80;       // % để tính là "đạt" một bài
let stu = { students: [], attempts: [], stats: {}, dup: {}, unmatched: 0, loaded: false, shown: 40, open: null, tab: "list", sort: "recent", period: 7, showDept: true };
const stuKey = n => hbeFold(String(n || "")).replace(/\s+/g, " ").trim();
async function stuFetchAll(){
  const students = [];
  for(let guard = 0; guard < 60; guard++){
    const d = await callRpc("admin_list_students", { p_password: PASSWORD, p_search: null, p_status: "all", p_limit: 200, p_offset: students.length }).catch(() => null);
    if(!d || d.status !== "ok" || !(d.students || []).length) break;
    students.push.apply(students, d.students);
    if(students.length >= (d.total || 0)) break;
  }
  const attempts = [];
  await Promise.all(quizSets.filter(s => s.attempt_count > 0).map(async set => {
    for(let off = 0, guard = 0; guard < 40; guard++){
      const d = await callRpc("admin_list_quiz_attempts", { p_password: PASSWORD, p_quiz_slug: set.slug, p_limit: 200, p_offset: off }).catch(() => null);
      const rows = (d && d.status === "ok" && d.attempts) || [];
      rows.forEach(a => { if(a.total > 0) attempts.push({ set: set.slug, key: stuKey(a.taker_name), score: a.score, total: a.total, pct: a.score / a.total * 100, at: new Date(a.finished_at).getTime() }); });
      if(rows.length < 200) break;
      off += rows.length;
    }
  }));
  stu.students = students; stu.attempts = attempts; stu.loaded = true;
}
/* Bộ đề nào là bài học, bộ đề nào là thi thử, thuộc môn nào */
function stuSetInfo(){
  const info = {};
  lastLoadedSubjects.forEach(s => {
    (lessonsBySubjectCache[s.slug] || []).forEach(l => { if(l.quiz_slug && !info[l.quiz_slug]) info[l.quiz_slug] = { kind: "lesson", subj: s.slug, label: l.title }; });
    if(s.mock_exam_quiz_slug) info[s.mock_exam_quiz_slug] = { kind: "mock", subj: s.slug, label: "Thi thử" };
  });
  return info;
}
function stuAggregate(attempts, info){
  const by = {};
  attempts.forEach(a => {
    const st = by[a.key] || (by[a.key] = { n: 0, days: {}, last: 0, sets: {} });
    st.n++; st.days[new Date(a.at).toDateString()] = 1; if(a.at > st.last) st.last = a.at;
    const x = st.sets[a.set] || (st.sets[a.set] = { n: 0, best: -1, bestScore: 0, bestTotal: 0, firstAt: Infinity, first: 0, lastAt: 0 });
    x.n++; if(a.pct > x.best){ x.best = a.pct; x.bestScore = a.score; x.bestTotal = a.total; }
    if(a.at < x.firstAt){ x.firstAt = a.at; x.first = a.pct; } if(a.at > x.lastAt) x.lastAt = a.at;
  });
  Object.keys(by).forEach(k => {
    const st = by[k]; let passed = 0, sum = 0, cnt = 0, mock = null, gain = 0, gainN = 0;
    Object.keys(st.sets).forEach(slug => { const x = st.sets[slug], i = info[slug];
      sum += x.best; cnt++;
      if(i && i.kind === "lesson" && x.best >= STU_PASS) passed++;
      if(i && i.kind === "mock" && x.bestTotal >= 20 && (!mock || x.best > mock.best)) mock = { best: x.best, score: x.bestScore, total: x.bestTotal, subj: i.subj };
      if(x.n >= 2){ gain += x.best - x.first; gainN++; } });
    st.passed = passed; st.avg = cnt ? sum / cnt : 0; st.mock = mock; st.dayCount = Object.keys(st.days).length; st.gain = gainN ? gain / gainN : 0; st.gainN = gainN;
  });
  return by;
}
function stuCompute(){
  const info = stuSetInfo();
  stu.info = info;
  stu.lessonTotal = Object.keys(info).filter(k => info[k].kind === "lesson").length;
  stu.stats = stuAggregate(stu.attempts, info);
  const seen = {}; stu.dup = {};
  stu.students.forEach(s => { const k = stuKey(s.full_name); if(seen[k]) stu.dup[k] = 1; seen[k] = 1; });
  stu.unmatched = Object.keys(stu.stats).filter(k => !seen[k]).length;
}
function stuLast(s){ const st = stu.stats[stuKey(s.full_name)]; return Math.max(s.last_seen_at ? new Date(s.last_seen_at).getTime() : 0, st ? st.last : 0); }
async function loadStudents(){
  const el = document.getElementById("students-table"); if(!el) return;
  if(!stu.loaded) el.innerHTML = `<span class="muted">Đang tải học viên và lượt làm bài...</span>`;
  await Promise.all([stuFetchAll(), ensureLessonsForGrouping()]);
  stuCompute();
  admPending = stu.students.filter(s => s.approval_status === "pending").length; admRenderNav();
  stuRender();
}
function stuSetTab(t){ stu.tab = t; stuRender(); }
function stuSetSort(v){ stu.sort = v; stuRender(); }
function stuToggle(id){ stu.open = stu.open === id ? null : id; stuRender(); }
function stuMore(){ stu.shown += 40; stuRender(); }
function stuRender(){
  document.querySelectorAll("[data-stu-tab]").forEach(b => b.classList.toggle("on", b.dataset.stuTab === stu.tab));
  document.getElementById("stu-pane-list").classList.toggle("hidden", stu.tab !== "list");
  document.getElementById("stu-pane-honor").classList.toggle("hidden", stu.tab !== "honor");
  if(!stu.loaded) return;
  const now = Date.now(), D = 86400000;
  const online = stu.students.filter(s => s.last_seen_at && now - new Date(s.last_seen_at).getTime() <= 5 * 60000).length;
  const active7 = stu.students.filter(s => now - stuLast(s) <= 7 * D).length;
  const noQuiz = stu.students.filter(s => !stu.stats[stuKey(s.full_name)]).length;
  const kpi = (n, label, val) => `<button type="button" class="adm-kpi stu-kpi" onclick="document.getElementById('stu-status').value='${val}';stuSetTab('list')"><b>${n}</b><span>${label}</span></button>`;
  document.getElementById("stu-kpis").innerHTML = kpi(stu.students.length, "Tổng học viên", "all") + kpi(online, "Đang online", "online") + kpi(active7, "Có học trong 7 ngày", "active7") + kpi(admPending, "Chờ duyệt", "pending") + kpi(noQuiz, "Chưa làm bài nào", "noquiz");
  if(stu.tab === "honor"){ stuRenderHonor(); return; }

  const q = stuKey(document.getElementById("stu-search").value), f = document.getElementById("stu-status").value;
  let rows = stu.students.filter(s => {
    if(q && stuKey([s.full_name, s.phone, s.email, s.broker_id, s.department].join(" ")).indexOf(q) < 0) return false;
    const last = stuLast(s), st = stu.stats[stuKey(s.full_name)];
    if(f === "online") return s.last_seen_at && now - new Date(s.last_seen_at).getTime() <= 5 * 60000;
    if(f === "active7") return now - last <= 7 * D;
    if(f === "idle14") return s.approval_status === "approved" && now - last > 14 * D;
    if(f === "noquiz") return !st;
    if(f !== "all") return (s.approval_status || "none") === f;
    return true;
  });
  const S = s => stu.stats[stuKey(s.full_name)] || { n: 0, passed: 0, avg: 0, mock: null, dayCount: 0 };
  const sorters = { recent: (a, b) => stuLast(b) - stuLast(a), passed: (a, b) => S(b).passed - S(a).passed || S(b).avg - S(a).avg, avg: (a, b) => S(b).avg - S(a).avg, mock: (a, b) => ((S(b).mock || {}).best || -1) - ((S(a).mock || {}).best || -1), name: (a, b) => String(a.full_name).localeCompare(String(b.full_name), "vi"), newest: (a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0) };
  rows.sort(sorters[stu.sort] || sorters.recent);
  const el = document.getElementById("students-table");
  if(!rows.length){ el.innerHTML = `<p class="muted">Không có học viên nào khớp bộ lọc.</p>`; document.getElementById("students-pager").innerHTML = ""; return; }
  const tot = stu.lessonTotal || 0;
  el.innerHTML = `<table class="stu-table">
    <tr><th>Học viên</th><th>Trạng thái</th><th>Hoạt động gần nhất</th><th>Bài đã đạt</th><th>Điểm trung bình</th><th>Thi thử cao nhất</th><th>Lượt làm</th><th></th></tr>
    ${rows.slice(0, stu.shown).map(s => {
      const st = S(s), lab = STATUS_LABEL[s.approval_status] || STATUS_LABEL.none, last = stuLast(s);
      const on = s.last_seen_at && now - new Date(s.last_seen_at).getTime() <= 5 * 60000;
      const open = stu.open === s.id;
      return `<tr class="${open ? "open" : ""}">
        <td><b>${esc(s.full_name)}</b>${stu.dup[stuKey(s.full_name)] ? ` <span class="adm-warn" title="Có học viên khác trùng họ tên, số liệu làm bài bị gộp chung">trùng tên</span>` : ""}<div class="muted">${esc([s.phone, s.department, s.broker_id ? "ID " + s.broker_id : ""].filter(Boolean).join(" · "))}</div></td>
        <td><span class="pill" style="background:${lab.bg};color:${lab.fg};">${lab.text.replace(/^[^\wÀ-ỹ]+/, "")}</span></td>
        <td>${on ? `<span class="stu-on">Đang online</span>` : last ? esc(fmtRelative(new Date(last).toISOString())) : "—"}</td>
        <td>${st.n ? `<div class="stu-bar"><i style="width:${tot ? Math.min(100, st.passed / tot * 100) : 0}%"></i></div><span>${st.passed}/${tot}</span>` : `<span class="muted">chưa làm</span>`}</td>
        <td>${st.n ? Math.round(st.avg) + "%" : "—"}</td>
        <td>${st.mock ? `${st.mock.score}/${st.mock.total} <span class="muted">(${Math.round(st.mock.best)}%)</span>` : "—"}</td>
        <td>${st.n || 0}</td>
        <td style="white-space:nowrap;text-align:right;">
          ${s.approval_status === "pending" ? `<button class="btn-primary" type="button" onclick="approveStudent(${s.id})">Duyệt</button>` : ""}
          <button class="btn-secondary" type="button" aria-expanded="${open}" onclick="stuToggle(${s.id})">${open ? "Thu gọn" : "Chi tiết"}</button></td>
      </tr>${open ? `<tr class="stu-detail"><td colspan="8">${stuDetailHtml(s)}</td></tr>` : ""}`; }).join("")}
  </table>
  <p class="muted" style="margin-top:8px;">Hiện ${Math.min(stu.shown, rows.length)}/${rows.length} học viên. “Bài đã đạt” là số bài học có điểm cao nhất từ ${STU_PASS}% trở lên, trên tổng ${tot} bài có câu hỏi. Số liệu làm bài ghép theo họ tên${stu.unmatched ? `; có ${stu.unmatched} tên làm bài không khớp học viên nào` : ""}.</p>`;
  document.getElementById("students-pager").innerHTML = rows.length > stu.shown ? `<button class="btn-secondary" type="button" onclick="stuMore()">Hiện thêm</button>` : "";
  loadOnlineStudentCount();
}
function stuDetailHtml(s){
  const st = stu.stats[stuKey(s.full_name)];
  const subjects = lastLoadedSubjects.map(sub => {
    const lessons = (lessonsBySubjectCache[sub.slug] || []).filter(l => l.quiz_slug);
    const chips = lessons.map((l, i) => { const x = st && st.sets[l.quiz_slug];
      return `<span class="stu-chip ${x ? (x.best >= STU_PASS ? "ok" : "mid") : ""}" title="${esc(l.title)}${x ? " · làm " + x.n + " lần" : " · chưa làm"}">Bài ${i + 1}${x ? " · " + Math.round(x.best) + "%" : ""}</span>`; }).join("");
    const m = st && sub.mock_exam_quiz_slug && st.sets[sub.mock_exam_quiz_slug];
    const any = (st && (lessons.some(l => st.sets[l.quiz_slug]) || m));
    if(!lessons.length && !sub.mock_exam_quiz_slug) return "";
    return `<div class="stu-subj"><b>${esc(sub.title)}</b>${any ? "" : ` <span class="muted">· chưa làm bài nào</span>`}<div class="stu-chips">${chips}${sub.mock_exam_quiz_slug ? `<span class="stu-chip ${m ? (m.best >= STU_PASS ? "ok" : "mid") : ""}">Thi thử${m ? " · " + m.bestScore + "/" + m.bestTotal + " · " + m.n + " lần" : ""}</span>` : ""}</div></div>`; }).join("");
  const recent = stu.attempts.filter(a => a.key === stuKey(s.full_name)).sort((a, b) => b.at - a.at).slice(0, 6);
  const nameOf = slug => { const i = stu.info[slug]; const set = quizSets.find(q => q.slug === slug); return i ? (i.kind === "mock" ? "Thi thử · " + admSubjTitle(i.subj) : i.label) : (set ? set.title : slug); };
  const q = v => esc(v).replace(/'/g, "\\'");
  return `<div class="stu-dgrid">
    <div>${subjects || `<p class="muted">Chưa có bài học nào gắn câu hỏi.</p>`}
      <p class="muted" style="margin:8px 0 0;">Xanh: đã đạt từ ${STU_PASS}%. Vàng: đã làm nhưng chưa đạt. Xám: chưa làm. Số % là điểm cao nhất.</p></div>
    <div>

const HONOR_PERIODS = [[7, "7 ngày qua"], [30, "30 ngày qua"], [0, "Từ đầu khoá"]];
function stuHonorData(){
  const since = stu.period ? Date.now() - stu.period * 86400000 : 0;
  const agg = stuAggregate(stu.attempts.filter(a => a.at >= since), stu.info);
  const people = stu.students.filter(s => !stu.dup[stuKey(s.full_name)] || true).map(s => ({ s, st: agg[stuKey(s.full_name)] })).filter(x => x.st);
  const seen = {}; const uniq = people.filter(x => { const k = stuKey(x.s.full_name); if(seen[k]) return false; seen[k] = 1; return true; });
  const top = (score, fmt, tie) => uniq.map(x => ({ x, v: score(x.st) })).filter(o => o.v > 0).sort((a, b) => b.v - a.v || (tie ? tie(b.x.st) - tie(a.x.st) : 0) || a.x.st.last - b.x.st.last).slice(0, 5)
    .map(o => ({ name: o.x.s.full_name, dept: stu.showDept ? (o.x.s.department || "") : "", value: fmt(o.x.st) }));
  return {
    updated: new Date().toISOString(), period: stu.period, label: (HONOR_PERIODS.find(p => p[0] === stu.period) || [])[1],
    boards: [
      { key: "cham", title: "Chăm chỉ nhất", desc: "Số ngày có làm bài", rows: top(st => st.dayCount, st => st.dayCount + " ngày học", st => st.n) },
      { key: "dat", title: "Về đích nhiều bài nhất", desc: "Số bài học đạt từ " + STU_PASS + "%", rows: top(st => st.passed, st => st.passed + " bài đạt", st => st.avg) },
      { key: "thi", title: "Điểm thi thử cao nhất", desc: "Lần thi thử tốt nhất", rows: top(st => st.mock ? st.mock.best : 0, st => st.mock.score + "/" + st.mock.total) },
      { key: "tienbo", title: "Tiến bộ nhất", desc: "Điểm tốt nhất so với lần làm đầu", rows: top(st => st.gainN ? Math.round(st.gain) : 0, st => "+" + Math.round(st.gain) + " điểm %", st => st.gainN) }
    ]
  };
}
function stuRenderHonor(){
  const el = document.getElementById("stu-honor"); if(!el) return;
  const d = stuHonorData();
  el.innerHTML = `
    <div class="adm-cardhead">
      <div class="adm-actions">${HONOR_PERIODS.map(p => `<button type="button" class="adm-chip ${stu.period === p[0] ? "on" : ""}" onclick="stu.period=${p[0]};stuRender()">${p[1]}</button>`).join("")}
        <label class="adm-check"><input type="checkbox" ${stu.showDept ? "checked" : ""} onchange="stu.showDept=this.checked;stuRender()"> Hiện tên phòng</label></div>
      <div class="adm-actions"><button class="btn-secondary" type="button" onclick="stuHonorPublish(true)">Gỡ khỏi trang học viên</button><button class="btn-primary" type="button" onclick="stuHonorPublish(false)">Công bố lên trang học viên</button></div>
    </div>
    <div id="stu-honor-msg"></div>
    <div class="honor-grid">${d.boards.map(b => `<div class="honor-board"><h3>${esc(b.title)}</h3><p class="muted">${esc(b.desc)} · ${esc(d.label)}</p>
      ${b.rows.length ? `<ol>${b.rows.map((r, i) => `<li><span class="rk">${i + 1}</span><span class="nm"><b>${esc(r.name)}</b>${r.dept ? `<span class="muted"> · ${esc(r.dept)}</span>` : ""}</span><span class="vl">${esc(r.value)}</span></li>`).join("")}</ol>` : `<p class="muted">Chưa có ai trong khoảng thời gian này.</p>`}</div>`).join("")}</div>
    <p class="muted" style="margin-top:12px;">Bảng tính từ lượt làm bài, ghép theo họ tên học viên. Học viên chỉ thấy bảng sau khi bạn bấm “Công bố”; mỗi lần công bố là chụp lại số liệu tại thời điểm đó, muốn cập nhật thì công bố lại. Trang học viên hiện họ tên${stu.showDept ? " và phòng" : ""}, không hiện số điện thoại hay email.</p>`;
}
async function stuHonorPublish(remove){
  const d = remove ? { updated: new Date().toISOString(), boards: [] } : stuHonorData();
  if(!remove && !d.boards.some(b => b.rows.length)){ document.getElementById("stu-honor-msg").innerHTML = `<div class="msg err">Chưa có số liệu để công bố trong khoảng thời gian này.</div>`; return; }
  if(!confirm(remove ? "Gỡ bảng vinh danh khỏi trang học viên?" : "Công bố bảng vinh danh này lên trang học viên? Mọi học viên sẽ thấy họ tên các bạn trong bảng.")) return;
  const res = await contentSave("vinhdanh", d, "vinh-danh.json");
  admLog(remove ? "Gỡ bảng vinh danh" : "Công bố bảng vinh danh (" + d.label + ")");
  document.getElementById("stu-honor-msg").innerHTML = contentSavedMsg(res);
}

const FB_PAGE_SIZE = 20;
let feedbackOffset = 0;
let feedbackTotal = 0;

async function loadFeedback(offset){
  feedbackOffset = offset;
  const statusEl = document.getElementById("fb-status");
  const status = statusEl ? statusEl.value : "new";
  const el = document.getElementById("feedback-table");
  if(!el) return;
  el.innerHTML = `<span class="muted">Đang tải...</span>`;
  const data = await callRpc("admin_list_question_feedback", { p_password: PASSWORD, p_status: status, p_limit: FB_PAGE_SIZE, p_offset: offset });
  if(!data || data.status !== "ok"){ el.innerHTML = `<p class="muted">Không tải được.</p>`; return; }
  feedbackTotal = data.total;
  const rows = data.items;
  if(rows.length === 0){ el.innerHTML = `<p class="muted">Không có phản hồi nào.</p>`; document.getElementById("feedback-pager").innerHTML = ""; return; }
  el.innerHTML = `
    <table>
      <tr><th>Trạng thái</th><th>Bộ đề</th><th>Câu hỏi</th><th>Nội dung phản hồi</th><th>Học viên</th><th>Thời gian</th><th></th></tr>
      ${rows.map(f => `
        <tr>
          <td>${f.status === "new" ? `<span class="pill" style="background:var(--warn-soft);color:var(--warn);">🆕 Chưa xem</span>` : `<span class="pill" style="background:var(--ok-soft);color:var(--green);">✅ Đã xem</span>`}</td>
          <td>${esc(f.quiz_slug||"—")}</td>
          <td style="max-width:220px;">${esc(f.question_text||"—")}</td>
          <td style="max-width:220px;">${esc(f.feedback_text)}</td>
          <td>${esc(f.taker_name||"—")}</td>
          <td>${fmtDT(f.created_at)}</td>
          <td style="white-space:nowrap;">
            ${f.status !== "reviewed" ? `<button class="btn-secondary" onclick="markFeedback(${f.id},'reviewed')">Đánh dấu đã xem</button>` : `<button class="btn-secondary" onclick="markFeedback(${f.id},'new')">Đánh dấu chưa xem</button>`}
            <button class="btn-danger" onclick="deleteFeedback(${f.id})">Xoá</button>
          </td>
        </tr>
      `).join("")}
    </table>
    <p class="muted" style="margin-top:8px;">Tổng ${feedbackTotal} phản hồi.</p>
  `;
  const pager = document.getElementById("feedback-pager");
  const hasPrev = offset > 0;
  const hasNext = offset + FB_PAGE_SIZE < feedbackTotal;
  pager.innerHTML = `
    <button class="btn-secondary" ${hasPrev ? "" : "disabled"} onclick="loadFeedback(${Math.max(0, offset - FB_PAGE_SIZE)})">← Trước</button>
    <button class="btn-secondary" ${hasNext ? "" : "disabled"} onclick="loadFeedback(${offset + FB_PAGE_SIZE})">Sau →</button>
  `;
}

      <tr><th>Người làm</th><th>Điểm</th><th>Thời gian nộp</th></tr>
      ${at.map(a => `
        <tr><td>${esc(a.taker_name)}</td><td>${a.score}/${a.total}</td><td>${new Date(a.finished_at).toLocaleString("vi-VN")}</td></tr>
      `).join("")}
    </table>
  `;
}

function readExcelFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const wb = XLSX.read(e.target.result, { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
        resolve(rows);
      } catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

/* Chuẩn hoá chữ để so khớp "Đáp án đúng" với 4 lựa chọn, tránh lỗi do:
   - thừa khoảng trắng / khoảng trắng không ngắt dòng (dán từ Word/PDF)
   - chữ hoa/thường khác nhau
   - 2 cách gõ dấu tiếng Việt khác nhau (Unicode tổ hợp) trông giống hệt nhau nhưng là chuỗi khác nhau */
function normalizeAnswerText(s){
  return String(s||"")
    .normalize("NFC")
    .replace(/ /g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}
function stripLetterPrefix(s){
  return String(s||"").replace(/^\s*[A-DĐa-dđ]\s*[\.\)\-:]\s*/, "").trim();
}
// Khớp "Đáp án đúng" với 1 trong 4 lựa chọn. Trả về { text } nếu khớp được đúng 1 lựa chọn,
// hoặc { error } nếu không xác định được (đáp án đúng này sẽ bị bỏ qua, không nhập vào).
function resolveCorrectAnswer(rawAnswer, options){
  const raw = String(rawAnswer||"").trim();
  if(!raw) return { error: `cột "Đáp án đúng" đang để trống` };

  // Cho phép gõ tắt chữ cái A/B/C/D (hoặc số 1-4) thay vì chép lại cả câu — tránh hẳn lỗi gõ sai/thừa khoảng trắng.
  const letterMatch = raw.match(/^([A-Da-d]|[1-4])[\.\)]?$/);
  if(letterMatch){
    const map = { "1":"a","2":"b","3":"c","4":"d", a:"a",b:"b",c:"c",d:"d" };
    const key = map[letterMatch[1].toLowerCase()];
    const opt = options.find(o => o.key === key);
    if(opt && opt.text) return { text: opt.text };
    return { error: `chọn đáp án ${raw.toUpperCase()} nhưng lựa chọn ${key ? key.toUpperCase() : raw.toUpperCase()} đang để trống` };
  }

  const normAnswer = normalizeAnswerText(stripLetterPrefix(raw));
  const matches = options.filter(o => o.text && normalizeAnswerText(stripLetterPrefix(o.text)) === normAnswer);
  if(matches.length === 1) return { text: matches[0].text };
  if(matches.length > 1) return { error: `nội dung "Đáp án đúng" trùng với ${matches.length} lựa chọn cùng lúc, không xác định được chọn lựa chọn nào` };
  return { error: `nội dung "Đáp án đúng" không khớp với lựa chọn nào trong 4 lựa chọn (có thể gõ sai chính tả hoặc thừa khoảng trắng). Mẹo: có thể gõ luôn chữ cái A/B/C/D thay vì chép lại cả câu` };
}

async function auditAllAnswers(){
  const btn = document.getElementById("audit-answers-btn");
  const resultEl = document.getElementById("audit-answers-result");
  if(!quizSets.length){ resultEl.innerHTML = `<p class="muted">Chưa có bộ đề nào.</p>`; return; }
  btn.disabled = true; btn.innerText = `Đang quét ${quizSets.length} bộ đề...`;
  resultEl.innerHTML = "";

  const results = await Promise.all(quizSets.map(s => callRpc("admin_list_quiz_questions", { p_password: PASSWORD, p_quiz_slug: s.slug }).catch(() => null)));

  const problems = [];
  quizSets.forEach((s,i) => {
    const data = results[i];
    if(!data || data.status !== "ok") return;
    (data.questions || []).forEach(q => {
      const options = [
        { text: (q.option_a||"").trim() }, { text: (q.option_b||"").trim() },
        { text: (q.option_c||"").trim() }, { text: (q.option_d||"").trim() }
      ];
      const norm = normalizeAnswerText(q.correct_answer);
      const matches = options.filter(o => o.text && normalizeAnswerText(o.text) === norm);
      if(matches.length !== 1){
        problems.push({
          setTitle: s.title, setSlug: s.slug, stt: q.stt, question: q.question || "",
          reason: matches.length === 0 ? "đáp án đúng không khớp với lựa chọn nào" : `đáp án đúng trùng ${matches.length} lựa chọn cùng lúc`
        });
      }
    });
  });

  btn.disabled = false; btn.innerText = "Quét toàn bộ";

  if(!problems.length){
    resultEl.innerHTML = `<div class="msg ok">✅ Không phát hiện câu nào bị lỗi đáp án trong toàn bộ ${quizSets.length} bộ đề. Các file đã nhập trước đây không cần sửa lại.</div>`;
    return;
  }
  resultEl.innerHTML = `
    <div class="msg err">⚠️ Phát hiện ${problems.length} câu có đáp án đúng không khớp chuẩn — những câu này đang chấm sai hoặc không chấm được điểm cho học viên, cần sửa lại:</div>
    <table style="margin-top:8px;">
      <tr><th>Bộ đề</th><th>STT</th><th>Câu hỏi</th><th>Lỗi</th><th></th></tr>
      ${problems.map(p => `
        <tr>
          <td><b>${esc(p.setTitle)}</b><br><span class="muted">${esc(p.setSlug)}</span></td>
          <td>${p.stt != null ? p.stt : "—"}</td>
          <td>${esc(p.question.length > 90 ? p.question.slice(0,90)+"..." : p.question)}</td>
          <td>${esc(p.reason)}</td>
          <td><button class="btn-secondary" onclick="setSetsView('flat');openDetail('${p.setSlug.replace(/'/g,"\\'")}')">Mở bộ đề</button></td>
        </tr>
      `).join("")}
    </table>
  `;
}

async function importExcel(){
  const fileInput = document.getElementById("excel-file");
  const msgEl = document.getElementById("import-msg");
  if(!fileInput.files.length){ msgEl.innerHTML = `<div class="msg err">Chọn file Excel trước.</div>`; return; }
  msgEl.innerHTML = `<div class="msg">Đang đọc file...</div>`;
  let rows;
  try{ rows = await readExcelFile(fileInput.files[0]); }
  catch(err){ msgEl.innerHTML = `<div class="msg err">Không đọc được file: ${esc(err.message)}</div>`; return; }

  // Bỏ hàng tiêu đề (dò hàng đầu tiên có cột 1 không phải số => tiêu đề)
  let startRow = 0;
  if(rows.length && isNaN(parseInt(rows[0][0]))) startRow = 1;

  const questions = [];
  const rowErrors = [];
  for(let i = startRow; i < rows.length; i++){
    const r = rows[i];
    if(!r || r.length === 0 || (!r[1] && !r[1+0])) continue;
    const stt = parseInt(r[0]);
    const question = String(r[1]||"").trim();
    if(!question) continue;

    const options = [
      { key: "a", text: String(r[2]||"").trim() },
      { key: "b", text: String(r[3]||"").trim() },
      { key: "c", text: String(r[4]||"").trim() },
      { key: "d", text: String(r[5]||"").trim() }
    ];
    const resolved = resolveCorrectAnswer(r[6], options);
    if(resolved.error){
      rowErrors.push(`Dòng ${i+1}${isNaN(stt)?"":" (STT "+stt+")"}: ${resolved.error}`);
      continue; // bỏ qua câu này, không nhập, để tránh lưu 1 câu không chấm được điểm
    }

    questions.push({
      stt: isNaN(stt) ? undefined : stt,
      question,
      option_a: options[0].text,
      option_b: options[1].text,
      option_c: options[2].text,
      option_d: options[3].text,
      correct_answer: resolved.text, // luôn lưu đúng nguyên văn lựa chọn đã khớp, đảm bảo khớp tuyệt đối khi chấm điểm
      explanation: String(r[7]||"").trim(),
      topic: String(r[8]||"").trim()
    });
  }

  if(questions.length === 0 && rowErrors.length === 0){ msgEl.innerHTML = `<div class="msg err">Không tìm thấy câu hỏi hợp lệ trong file.</div>`; return; }

  let upsertedCount = 0;
  if(questions.length){
    msgEl.innerHTML = `<div class="msg">Đang nhập ${questions.length} câu hỏi...</div>`;
    const data = await callRpc("admin_bulk_upsert_quiz_questions", { p_password: PASSWORD, p_quiz_slug: currentSlug, p_questions: questions });
    if(!data || data.status !== "ok"){
      msgEl.innerHTML = `<div class="msg err">Lỗi khi nhập: ${esc(data && data.status)}</div>`;
      return;
    }
    upsertedCount = data.upserted;
  }

  const okPart = upsertedCount ? `<div class="msg ok">Đã nhập/cập nhật ${upsertedCount} câu hỏi.</div>` : "";
  const errPart = rowErrors.length ? `
    <div class="msg err">
      ⚠️ ${rowErrors.length} câu bị <b>bỏ qua</b> do không xác định được đáp án đúng — sửa lại trong Excel rồi nhập lại riêng các câu đó:
      <ul style="margin:6px 0 0 18px;padding:0;">${rowErrors.map(e => `<li>${esc(e)}</li>`).join("")}</ul>
    </div>` : "";
  msgEl.innerHTML = okPart + errPart;
  if(upsertedCount){
    const setInfo = quizSets.find(x => x.slug === currentSlug);
    admLog("Nhập " + upsertedCount + " câu từ Excel · " + (setInfo ? setInfo.title : currentSlug), admSubjectOfSet(currentSlug) || "");
    fileInput.value = "";
    loadQuestions(currentSlug);
    refreshSets();
  }
}
