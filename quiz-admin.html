<style>
  :root{ --navy:#1E2761; --ice:#CADCFC; --white:#FFFFFF; --dark:#1A1A2E; --light:#EEF1FB; --green:#1e7a34; --red:#b3261e; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--light);color:var(--dark);}
  header{background:var(--navy);color:var(--white);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
  header h1{margin:0;font-size:1.1rem;}
  main{max-width:980px;margin:0 auto;padding:18px;}
  .card{background:var(--white);border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .card h2{margin:0 0 12px;font-size:1rem;color:var(--navy);}
  label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 4px;}
  input[type=text],input[type=password],select,textarea{width:100%;padding:9px 10px;border:1px solid #ccd3e8;border-radius:7px;font-size:.92rem;font-family:inherit;}
  button{cursor:pointer;border:none;border-radius:7px;font-size:.88rem;font-weight:600;padding:9px 16px;}
  .btn-primary{background:var(--navy);color:var(--white);}
  .btn-danger{background:var(--red);color:var(--white);}
  .btn-secondary{background:var(--light);color:var(--navy);border:1px solid var(--navy);}
  table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:10px;}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #eceff8;}
  th{color:var(--navy);font-weight:700;background:var(--light);}
  tr:hover td{background:#f7f9fe;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:160px;}
  .msg{font-size:.85rem;margin-top:8px;padding:8px 10px;border-radius:6px;}
  .msg.ok{background:#e9f7ec;color:var(--green);}
  .msg.err{background:#fbeceb;color:var(--red);}
  .muted{color:#888;font-size:.85rem;}
  .pill{display:inline-block;background:var(--ice);color:var(--navy);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:10px;}
  .hidden{display:none;}
  .center{text-align:center;}
  .tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;background:var(--white);border-radius:10px;padding:6px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow-x:auto;}
  .tab-btn{flex:1;min-width:150px;white-space:nowrap;background:transparent;color:var(--navy);border-radius:7px;padding:10px 14px;font-weight:700;font-size:.88rem;text-align:center;}
  .tab-btn:hover{background:var(--light);}
  .tab-btn.active{background:var(--navy);color:var(--white);}
  .tab-content.hidden{display:none;}
</style>
</head>

async function callRpc(fn, args){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` },
    body: JSON.stringify(args || {})
  });
  return res.json();
}

function esc(s){ const d=document.createElement("div"); d.innerText = s==null?"":String(s); return d.innerHTML; }

// Chuẩn hoá slug dùng trong đường dẫn upload: bỏ dấu tiếng Việt, đổi khoảng trắng/ký tự lạ thành "-"
function slugify(s){
  return String(s||"")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/đ/g, "d").replace(/Đ/g, "D")
    .trim().toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    || "tam";
}

async function login(){
  const pw = document.getElementById("pw-input").value;
  const data = await callRpc("admin_list_quiz_sets", { p_password: pw });
  if(data && data.status === "ok"){
    PASSWORD = pw;
    sessionStorage.setItem("quiz_admin_pw", pw);
    renderMain(data.quiz_sets);
  } else {
    document.getElementById("login-msg").innerHTML = `<div class="msg err">Sai mật khẩu.</div>`;
  }
}
function logout(){
  sessionStorage.removeItem("quiz_admin_pw");

function showTab(id){
  document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  const panel = document.getElementById(id);
  const btn = document.querySelector(`.tab-btn[data-tab="${id}"]`);
  if(panel) panel.classList.remove("hidden");
  if(btn) btn.classList.add("active");
  sessionStorage.setItem("quiz_admin_tab", id);
}

let allQuizSlugs = [];
let currentSubjectSlug = null;
let lastLoadedSubjects = [];

function editSubject(i){
  const s = lastLoadedSubjects[i];
  if(!s) return;
  document.getElementById("subj-slug").value = s.slug;
  document.getElementById("subj-title").value = s.title;
  document.getElementById("subj-desc").value = s.description || "";
  document.getElementById("subj-order").value = s.order_index;
  document.getElementById("subj-mock-slug").value = s.mock_exam_quiz_slug || "";
  document.getElementById("subj-mock-count").value = s.mock_exam_count;
  document.getElementById("subj-slug").scrollIntoView({behavior:"smooth", block:"center"});
}

async function loadSubjects(){
  const [data, timeData] = await Promise.all([
    callRpc("admin_list_subjects", { p_password: PASSWORD }),
    callRpc("admin_list_mock_exam_time_limits", { p_password: PASSWORD }).catch(() => null)
  ]);
  const el = document.getElementById("subjects-table");
  if(!data || data.status !== "ok"){ el.innerHTML = `<p class="muted">Không tải được.</p>`; return; }
  allQuizSlugs = quizSets.map(s => s.slug);
  const subs = data.subjects;
  const timeLimits = {};
  if(timeData && timeData.status === "ok"){
    (timeData.items||[]).forEach(it => { timeLimits[it.slug] = it.mock_exam_time_limit_minutes; });
  }
  lastLoadedSubjects = subs;
  if(subs.length === 0){ el.innerHTML = `<p class="muted">Chưa có môn học nào.</p>`; return; }
  el.innerHTML = `
    <table>
      <tr><th>Môn học</th><th>Số bài</th><th>Đề ôn tập</th><th>Thời gian làm bài</th><th></th><th></th><th></th></tr>
      ${subs.map((s,i) => `
        <tr>
          <td><b>${esc(s.title)}</b><br><span class="muted">${esc(s.slug)}</span></td>
          <td>${s.lesson_count}</td>
          <td>${esc(s.mock_exam_quiz_slug||"—")} (${s.mock_exam_count})</td>
          <td style="white-space:nowrap;">
            <input type="text" id="time-${esc(s.slug)}" value="${timeLimits[s.slug] != null ? timeLimits[s.slug] : ""}" placeholder="Không giới hạn" style="width:110px;display:inline-block;">
            <button class="btn-secondary" onclick="saveExamTimeLimit('${s.slug.replace(/'/g,"\\'")}')">Lưu</button>
          </td>
          <td><button class="btn-primary" onclick="manageMockExamQuestions('${(s.mock_exam_quiz_slug||"").replace(/'/g,"\\'")}')">📥 Câu hỏi ôn tập</button></td>
          <td><button class="btn-secondary" onclick="openLessons('${s.slug.replace(/'/g,"\\'")}')">Quản lý bài học</button></td>
          <td><button class="btn-secondary" onclick="editSubject(${i})">Sửa</button></td>
        </tr>
      `).join("")}
    </table>
    <p class="muted" style="margin-top:8px;">Thời gian làm bài tính bằng phút, để trống = không giới hạn thời gian (đáp án vẫn ẩn tới khi nộp bài).</p>
  `;
}

async function saveExamTimeLimit(slug){
  const input = document.getElementById(`time-${slug}`);
  const raw = input.value.trim();
  const minutes = raw === "" ? null : parseInt(raw);
  if(raw !== "" && (isNaN(minutes) || minutes <= 0)){
    alert("Số phút phải là số nguyên dương, hoặc để trống nếu không giới hạn.");
    return;
  }
  const data = await callRpc("admin_set_mock_exam_time_limit", { p_password: PASSWORD, p_subject_slug: slug, p_minutes: minutes });
  if(!data || data.status !== "ok"){ alert("Lỗi khi lưu: " + (data && data.status)); return; }
  loadSubjects();
}

function manageMockExamQuestions(slug){
  if(!slug){
    alert("Môn này chưa gán bộ đề cho \"Câu hỏi ôn tập\". Vào phần tạo/cập nhật môn học ở trên, điền ô \"Slug bộ đề dùng cho Câu hỏi ôn tập\" trước nhé.");
    return;
  }
  if(!quizSets.some(s => s.slug === slug)){
    alert(`Không tìm thấy bộ đề "${slug}" trong danh sách bộ đề. Kiểm tra lại slug đã gán cho môn học này.`);
    return;
  }
  showTab("tab-quiz");
  openDetail(slug);
  setTimeout(() => {
    const panel = document.getElementById("detail-panel");
    if(panel) panel.scrollIntoView({ behavior: "smooth" });
  }, 100);
}

async function createSubject(){
  const slug = document.getElementById("subj-slug").value.trim();
  const title = document.getElementById("subj-title").value.trim();
  const desc = document.getElementById("subj-desc").value.trim();
  const order = parseInt(document.getElementById("subj-order").value) || 0;
  let mockSlug = document.getElementById("subj-mock-slug").value.trim() || null;
  const mockCount = parseInt(document.getElementById("subj-mock-count").value) || 35;
  const msgEl = document.getElementById("subj-msg");
  if(!slug || !title){ msgEl.innerHTML = `<div class="msg err">Cần nhập slug và tên môn học.</div>`; return; }
  // Để trống ô "Slug bộ đề ôn tập" khi đang cập nhật môn đã có sẵn => giữ nguyên giá trị cũ, không xoá mất.
  if(!mockSlug){
    const existing = lastLoadedSubjects.find(s => s.slug === slug);
    if(existing && existing.mock_exam_quiz_slug) mockSlug = existing.mock_exam_quiz_slug;
  }
  const data = await callRpc("admin_upsert_subject", { p_password: PASSWORD, p_slug: slug, p_title: title, p_description: desc, p_order_index: order, p_mock_exam_quiz_slug: mockSlug, p_mock_exam_count: mockCount });
  if(data.status === "ok"){
    msgEl.innerHTML = `<div class="msg ok">Đã lưu môn học "${esc(title)}".</div>`;
    loadSubjects();
  } else {
    msgEl.innerHTML = `<div class="msg err">Lỗi: ${esc(data.status)}</div>`;
  }
}

      <div><label>Tên bài</label><input type="text" id="les-title" placeholder="vd: Bài 1"></div>
      <div><label>Thứ tự</label><input type="text" id="les-order" placeholder="1"></div>
    </div>
    <div class="row">
      <div><label>Slug bộ đề Quizzi</label><input type="text" id="les-quiz" placeholder="vd: bai-1" list="quiz-slug-list"></div>
    </div>

let currentLessonDocuments = [];

function renderVideosList(){
  const el = document.getElementById("les-videos-list");
  if(!el) return;
  if(!currentLessonVideos.length){ el.innerHTML = `<p class="muted">Chưa có video nào cho bài này.</p>`; return; }
  el.innerHTML = currentLessonVideos.map((v,i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #eceff8;">
      <a href="${esc(v.url)}" target="_blank" rel="noopener" style="flex:1;font-weight:600;font-size:.88rem;">▶️ ${esc(v.label)}</a>
      <button class="btn-danger" type="button" onclick="removeVideo(${i})">Xoá</button>
    </div>
  `).join("");
}
function removeVideo(i){ currentLessonVideos.splice(i,1); renderVideosList(); }

function addVideoLink(){
  const labelEl = document.getElementById("les-video-label");
  const urlEl = document.getElementById("les-video-url");
  const msgEl = document.getElementById("les-video-msg");
  const label = labelEl.value.trim();
  const url = urlEl.value.trim();
  if(!label || !url){ msgEl.innerHTML = `<div class="msg err">Nhập tên video và dán link trước.</div>`; return; }

  renderVideosList();
  labelEl.value = ""; urlEl.value = "";
  msgEl.innerHTML = `<div class="msg ok">Đã thêm "${esc(label)}".</div>`;
}

async function uploadVideoFile(){
  const labelEl = document.getElementById("les-video-label");
  const fileEl = document.getElementById("les-video-file");
  const msgEl = document.getElementById("les-video-msg");
  const label = labelEl.value.trim();
  const file = fileEl.files[0];
  if(!label || !file){ msgEl.innerHTML = `<div class="msg err">Nhập tên video và chọn file trước.</div>`; return; }
  msgEl.innerHTML = `<div class="msg">Đang tải video lên, có thể mất một lúc...</div>`;
  try{
    const lessonSlug = slugify(document.getElementById("les-slug").value);
    const safeName = file.name.replace(/[^\w.\-]/g, "_");
    const path = `${slugify(currentSubjectSlug)}/${lessonSlug}/video-${Date.now()}-${safeName}`;
    const url = await uploadToStorage(file, path);
    currentLessonVideos.push({ label, url });
    renderVideosList();
    labelEl.value = ""; fileEl.value = "";
    msgEl.innerHTML = `<div class="msg ok">Đã tải video "${esc(label)}" lên.</div>`;

    msgEl.innerHTML = `<div class="msg err">Lỗi tải lên: ${esc(err.message)}</div>`;

function renderLessonDocsList(){
  const el = document.getElementById("les-docs-list");

  el.innerHTML = currentLessonDocuments.map((d,i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #eceff8;">

    </div>
  `).join("");
}
function removeLessonDoc(i){ currentLessonDocuments.splice(i,1); renderLessonDocsList(); }

async function uploadToStorage(file, path){
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/lesson-files/${path}`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": file.type || "application/octet-stream",
      "x-upsert": "true"
    },
    body: file
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(`HTTP ${res.status}: ${t}`);
  }
  return `${SUPABASE_URL}/storage/v1/object/public/lesson-files/${path}`;
}

function renderMindmapPreview(){

  el.innerHTML = /\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(url)
    ? `<img src="${esc(url)}" style="max-width:280px;border-radius:8px;border:1px solid #e3e7f5;display:block;margin-bottom:8px;">`
    : `<a href="${esc(url)}" target="_blank" rel="noopener">Xem mindmap hiện tại</a>`;
}

let lastLoadedLessons = [];

async function loadLessonsTable(subjectSlug){
  const data = await callRpc("admin_list_lessons", { p_password: PASSWORD, p_subject_slug: subjectSlug });
  const el = document.getElementById("lessons-table");
  if(!data || data.status !== "ok"){ el.innerHTML = `<p class="muted">Không tải được.</p>`; return; }
  const lessons = data.lessons;
  lastLoadedLessons = lessons;
  if(lessons.length === 0){ el.innerHTML = `<p class="muted">Chưa có bài học nào.</p>`; return; }
  el.innerHTML = `
    <table>
      <tr><th>#</th><th>Bài</th><th>Video</th><th>Mindmap</th><th>Quiz</th><th>Tài liệu</th><th></th></tr>
      ${lessons.map((l,i) => `
        <tr>
          <td>${l.order_index}</td>
          <td><b>${esc(l.title)}</b><br><span class="muted">${esc(l.slug)}</span></td>
          <td>${(l.videos||[]).length ? "✅ ("+l.videos.length+")" : "—"}</td>
          <td>${l.mindmap_url ? "✅" : "—"}</td>
          <td>${esc(l.quiz_slug||"—")}</td>
          <td>${(l.documents||[]).length} file</td>
          <td style="white-space:nowrap;">
            <button class="btn-secondary" onclick="editLesson(lastLoadedLessons[${i}])">Sửa</button>
            <button class="btn-danger" onclick="deleteLesson('${l.slug.replace(/'/g,"\\'")}')">Xoá</button>
          </td>
        </tr>
      `).join("")}
    </table>
  `;
}

async function saveLesson(){
  const slug = document.getElementById("les-slug").value.trim();
  const title = document.getElementById("les-title").value.trim();
  const order = parseInt(document.getElementById("les-order").value) || 0;
  const mindmap = document.getElementById("les-mindmap").value.trim();
  const quizSlug = document.getElementById("les-quiz").value.trim() || null;
  const msgEl = document.getElementById("les-msg");
  if(!slug || !title){ msgEl.innerHTML = `<div class="msg err">Cần nhập slug và tên bài.</div>`; return; }

  const data = await callRpc("admin_upsert_lesson", {
    p_password: PASSWORD, p_subject_slug: currentSubjectSlug, p_slug: slug, p_title: title,
    p_order_index: order, p_videos: currentLessonVideos, p_mindmap_url: mindmap, p_documents: currentLessonDocuments, p_quiz_slug: quizSlug
  });
  if(data.status === "ok"){
    msgEl.innerHTML = `<div class="msg ok">Đã lưu bài "${esc(title)}".</div>`;
    document.getElementById("les-slug").value = ""; document.getElementById("les-title").value = "";
    document.getElementById("les-order").value = "";
    document.getElementById("les-mindmap").value = ""; document.getElementById("les-quiz").value = "";
    currentLessonDocuments = []; renderLessonDocsList();
    currentLessonVideos = []; renderVideosList();
    loadLessonsTable(currentSubjectSlug);
    loadSubjects();
    delete lessonsBySubjectCache[currentSubjectSlug];
  } else {
    msgEl.innerHTML = `<div class="msg err">Lỗi: ${esc(data.status)} ${esc(data.message||"")}</div>`;
  }
}

function editLesson(l){
  document.getElementById("les-slug").value = l.slug;
  document.getElementById("les-title").value = l.title;
  document.getElementById("les-order").value = l.order_index;
  document.getElementById("les-mindmap").value = l.mindmap_url || "";
  document.getElementById("les-quiz").value = l.quiz_slug || "";
  currentLessonDocuments = (l.documents || []).slice();
  renderLessonDocsList();
  currentLessonVideos = (l.videos || []).slice();
  renderVideosList();
  renderMindmapPreview();
  document.getElementById("les-slug").scrollIntoView({behavior:"smooth", block:"center"});
}

async function deleteLesson(lessonSlug){
  if(!confirm("Xoá bài học này?")) return;
  await callRpc("admin_delete_lesson", { p_password: PASSWORD, p_subject_slug: currentSubjectSlug, p_lesson_slug: lessonSlug });
  loadLessonsTable(currentSubjectSlug);
  loadSubjects();
  delete lessonsBySubjectCache[currentSubjectSlug];
}

/* ---------- Tài khoản học viên (đăng ký SĐT + email) ---------- */
const STU_PAGE_SIZE = 20;
let studentsOffset = 0;
let studentsTotal = 0;
let studentSearchTimer = null;

function debounceSearchStudents(){
  clearTimeout(studentSearchTimer);
  studentSearchTimer = setTimeout(() => loadStudents(0), 350);
}

function fmtDT(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString("vi-VN");
}

const STATUS_LABEL = {
  none: { text: "Chưa yêu cầu", bg: "#eee", fg: "#666" },
  pending: { text: "⏳ Chờ duyệt", bg: "#fdf1de", fg: "#a07a17" },
  approved: { text: "✅ Đã duyệt", bg: "#e9f7ec", fg: "var(--green)" },
  rejected: { text: "❌ Từ chối", bg: "#fbeceb", fg: "var(--red)" }
};

async function loadStudents(offset){
  studentsOffset = offset;
  const search = document.getElementById("stu-search").value.trim();
  const status = document.getElementById("stu-status").value;
  const el = document.getElementById("students-table");
  el.innerHTML = `<span class="muted">Đang tải...</span>`;
  const data = await callRpc("admin_list_students", { p_password: PASSWORD, p_search: search || null, p_status: status, p_limit: STU_PAGE_SIZE, p_offset: offset });
  if(!data || data.status !== "ok"){ el.innerHTML = `<p class="muted">Không tải được.</p>`; return; }
  studentsTotal = data.total;
  const rows = data.students;
  if(rows.length === 0){ el.innerHTML = `<p class="muted">Không có học viên nào khớp bộ lọc.</p>`; document.getElementById("students-pager").innerHTML = ""; return; }
  el.innerHTML = `
    <table>
      <tr><th>Họ tên</th><th>SĐT</th><th>Email</th><th>ID môi giới</th><th>Phòng</th><th>Trạng thái</th><th>Đăng ký lúc</th><th></th></tr>
      ${rows.map(s => {
        const st = STATUS_LABEL[s.approval_status] || STATUS_LABEL.none;
        return `
        <tr>
          <td><b>${esc(s.full_name)}</b></td>
          <td>${esc(s.phone)}</td>
          <td>${esc(s.email)}</td>
          <td>${esc(s.broker_id||"—")}</td>
          <td>${esc(s.department||"—")}</td>
          <td><span class="pill" style="background:${st.bg};color:${st.fg};">${st.text}</span></td>
          <td>${fmtDT(s.requested_at || s.created_at)}</td>
          <td style="white-space:nowrap;">
            ${s.approval_status !== "approved" ? `<button class="btn-secondary" style="color:var(--green);" onclick="approveStudent(${s.id})">Duyệt</button>` : ""}
            ${s.approval_status !== "rejected" && s.approval_status !== "none" ? `<button class="btn-secondary" style="color:var(--red);" onclick="rejectStudent(${s.id})">Từ chối</button>` : ""}
            <button class="btn-secondary" onclick="editStudent(${s.id},'${esc(s.full_name).replace(/'/g,"\\'")}','${esc(s.phone).replace(/'/g,"\\'")}','${esc(s.email).replace(/'/g,"\\'")}')">Sửa</button>
            <button class="btn-danger" onclick="deleteStudent(${s.id})">Xoá</button>
          </td>
        </tr>
      `;}).join("")}
    </table>
    <p class="muted" style="margin-top:8px;">Tổng ${studentsTotal} học viên.</p>
  `;
  const pager = document.getElementById("students-pager");
  const hasPrev = offset > 0;
  const hasNext = offset + STU_PAGE_SIZE < studentsTotal;
  pager.innerHTML = `
    <button class="btn-secondary" ${hasPrev ? "" : "disabled"} onclick="loadStudents(${Math.max(0, offset - STU_PAGE_SIZE)})">← Trước</button>
    <button class="btn-secondary" ${hasNext ? "" : "disabled"} onclick="loadStudents(${offset + STU_PAGE_SIZE})">Sau →</button>
  `;
}

async function approveStudent(id){
  await callRpc("admin_approve_student", { p_password: PASSWORD, p_id: id });
  loadStudents(studentsOffset);
}
async function rejectStudent(id){
  if(!confirm("Từ chối yêu cầu mở khoá của học viên này?")) return;
  await callRpc("admin_reject_student", { p_password: PASSWORD, p_id: id });
  loadStudents(studentsOffset);
}

async function loadSettings(){
  const data = await callRpc("get_portal_settings_public", {});
  if(data && data.status === "ok"){
    document.getElementById("settings-phone").value = data.support_phone || "";
    document.getElementById("settings-ctv").value = data.ctv_signup_url || "";
    const reqTitle = document.getElementById("settings-req-title");
    const reqDesc = document.getElementById("settings-req-desc");
    const pendingText = document.getElementById("settings-pending-text");
    const rejectedText = document.getElementById("settings-rejected-text");
    if(reqTitle) reqTitle.value = data.access_request_title || "";
    if(reqDesc) reqDesc.value = data.access_request_desc || "";
    if(pendingText) pendingText.value = data.access_pending_text || "";
    if(rejectedText) rejectedText.value = data.access_rejected_text || "";
  }
}
async function saveSettings(){
  const phone = document.getElementById("settings-phone").value.trim();
  const ctv = document.getElementById("settings-ctv").value.trim();
  const reqTitle = document.getElementById("settings-req-title").value.trim();
  const reqDesc = document.getElementById("settings-req-desc").value.trim();
  const pendingText = document.getElementById("settings-pending-text").value.trim();
  const rejectedText = document.getElementById("settings-rejected-text").value.trim();
  const msgEl = document.getElementById("settings-msg");
  const data = await callRpc("admin_update_portal_settings", {
    p_password: PASSWORD, p_support_phone: phone, p_ctv_signup_url: ctv,
    p_access_request_title: reqTitle, p_access_request_desc: reqDesc,
    p_access_pending_text: pendingText, p_access_rejected_text: rejectedText
  });
  const okMsg = `<div class="msg ok">Đã lưu cấu hình.</div>`;
  if(data && data.status === "ok"){
    msgEl.innerHTML = okMsg;
    document.getElementById("settings-req-msg").innerHTML = okMsg;
    document.getElementById("settings-reject-msg").innerHTML = okMsg;
  } else {
    const errMsg = `<div class="msg err">Lỗi: ${esc(data && data.status)}</div>`;
    msgEl.innerHTML = errMsg;
    document.getElementById("settings-req-msg").innerHTML = errMsg;
    document.getElementById("settings-reject-msg").innerHTML = errMsg;
  }
}

async function editStudent(id, curName, curPhone, curEmail){
  const name = prompt("Họ tên:", curName);
  if(name === null) return;
  const phone = prompt("Số điện thoại:", curPhone);
  if(phone === null) return;
  const email = prompt("Email:", curEmail);
  if(email === null) return;
  const data = await callRpc("admin_update_student", { p_password: PASSWORD, p_id: id, p_full_name: name.trim(), p_phone: phone.trim(), p_email: email.trim() });
  if(!data || data.status !== "ok"){ alert("Lỗi khi cập nhật: " + (data && data.status)); return; }
  loadStudents(studentsOffset);
}

async function deleteStudent(id){
  if(!confirm("Xoá tài khoản học viên này? Học viên sẽ cần đăng ký lại nếu muốn tiếp tục học.")) return;
  await callRpc("admin_delete_student", { p_password: PASSWORD, p_id: id });
  loadStudents(studentsOffset);
}

      `).join("")}
    </table>
    <p class="muted" style="margin-top:8px;">Tổng ${feedbackTotal} phản hồi.</p>
  `;
  const pager = document.getElementById("feedback-pager");
  const hasPrev = offset > 0;
  const hasNext = offset + FB_PAGE_SIZE < feedbackTotal;
  pager.innerHTML = `
    <button class="btn-secondary" ${hasPrev ? "" : "disabled"} onclick="loadFeedback(${Math.max(0, offset - FB_PAGE_SIZE)})">← Trước</button>
    <button class="btn-secondary" ${hasNext ? "" : "disabled"} onclick="loadFeedback(${offset + FB_PAGE_SIZE})">Sau →</button>
  `;
}

let setsViewMode = "grouped"; // "grouped" | "flat"
let lessonsBySubjectCache = {};

function setSetsView(mode){
  setsViewMode = mode;
  renderSetsTable();
}

function renderFlatSetsTable(sets){
  return `
    <table>
      <tr><th>Bộ đề</th><th>Số câu</th><th>Lượt làm</th><th>Trạng thái</th><th></th></tr>
      ${sets.map(s => `
        <tr>
          <td><b>${esc(s.title)}</b><br><span class="muted">${esc(s.slug)}</span></td>
          <td>${s.question_count}</td>
          <td>${s.attempt_count}</td>
          <td><span class="pill" style="background:${s.is_active ? '#CADCFC' : '#eee'};">${s.is_active ? 'Đang mở' : 'Đã ẩn'}</span></td>
          <td>
            <button class="btn-secondary" onclick="openDetail('${s.slug.replace(/'/g,"\\'")}')">Quản lý</button>
          </td>
        </tr>
      `).join("")}
    </table>
  `;
}

async function ensureLessonsForGrouping(){
  if(!lastLoadedSubjects.length){
    const data = await callRpc("admin_list_subjects", { p_password: PASSWORD });
    if(data && data.status === "ok") lastLoadedSubjects = data.subjects;
  }
  const slugs = lastLoadedSubjects.map(s => s.slug).filter(s => !(s in lessonsBySubjectCache));
  if(slugs.length){
    const results = await Promise.all(slugs.map(s => callRpc("admin_list_lessons", { p_password: PASSWORD, p_subject_slug: s }).catch(() => null)));
    slugs.forEach((s,i) => { lessonsBySubjectCache[s] = (results[i] && results[i].status === "ok") ? results[i].lessons : []; });
  }
}

async function renderSetsTable(){
  const el = document.getElementById("sets-table");
  if(!el) return;
  if(quizSets.length === 0){ el.innerHTML = `<p class="muted">Chưa có bộ đề nào.</p>`; return; }

  const toggleHtml = `
    <div style="margin-bottom:10px;">
      <button class="btn-secondary" onclick="setSetsView('grouped')" style="${setsViewMode==='grouped'?'background:#CADCFC;':''}">📚 Theo môn học</button>
      <button class="btn-secondary" onclick="setSetsView('flat')" style="${setsViewMode==='flat'?'background:#CADCFC;':''}">📋 Tất cả (${quizSets.length})</button>
    </div>
  `;

  if(setsViewMode === "flat"){
    el.innerHTML = toggleHtml + renderFlatSetsTable(quizSets);
    return;
  }

  el.innerHTML = toggleHtml + `<p class="muted">Đang nhóm theo môn học...</p>`;
  await ensureLessonsForGrouping();
  // Nếu khi chờ tải xong mà người dùng đã bấm chuyển view khác thì thôi, không ghi đè.
  if(setsViewMode !== "grouped") return;

  const usageBySlug = {};
  function addUsage(slug, subjTitle, subjSlug, label){
    if(!slug) return;
    (usageBySlug[slug] = usageBySlug[slug] || []).push({ subjTitle, subjSlug, label });
  }
  lastLoadedSubjects.forEach(s => {
    addUsage(s.mock_exam_quiz_slug, s.title, s.slug, "⭐ Câu hỏi ôn tập");
    (lessonsBySubjectCache[s.slug] || []).forEach(l => addUsage(l.quiz_slug, s.title, s.slug, `📘 ${esc(l.title)}`));
  });

  const groups = {};
  const unassigned = [];
  quizSets.forEach(set => {
    const usages = usageBySlug[set.slug];
    if(!usages || !usages.length){ unassigned.push(set); return; }
    usages.forEach(u => {
      groups[u.subjSlug] = groups[u.subjSlug] || { title: u.subjTitle, items: [] };
      groups[u.subjSlug].items.push({ set, label: u.label });
    });
  });

  let html = toggleHtml;
  lastLoadedSubjects.map(s => s.slug).forEach(slug => {
    const g = groups[slug];
    if(!g || !g.items.length) return;
    html += `
      <div class="card" style="background:#f7f9ff;margin-bottom:10px;padding:14px;">
        <h3 style="margin:0 0 8px;">${esc(g.title)}</h3>
        <table>
          <tr><th>Dùng cho</th><th>Bộ đề</th><th>Số câu</th><th>Lượt làm</th><th>Trạng thái</th><th></th></tr>
          ${g.items.map(({set,label}) => `
            <tr>
              <td>${label}</td>
              <td><b>${esc(set.title)}</b><br><span class="muted">${esc(set.slug)}</span></td>
              <td>${set.question_count}</td>
              <td>${set.attempt_count}</td>
              <td><span class="pill" style="background:${set.is_active ? '#CADCFC' : '#eee'};">${set.is_active ? 'Đang mở' : 'Đã ẩn'}</span></td>
              <td><button class="btn-secondary" onclick="openDetail('${set.slug.replace(/'/g,"\\'")}')">Quản lý</button></td>
            </tr>
          `).join("")}
        </table>
      </div>
    `;
  });
  if(unassigned.length){
    html += `
      <div class="card" style="background:#fff7f0;margin-bottom:10px;padding:14px;">
        <h3 style="margin:0 0 8px;">⚠️ Chưa gán vào môn học nào (${unassigned.length})</h3>
        <p class="muted" style="margin-top:-4px;">Bộ đề này chưa được chọn làm "Câu hỏi ôn tập" hay Quizzi của bài học nào. Vào tab "Môn học &amp; bài học" để gán.</p>
        ${renderFlatSetsTable(unassigned)}
      </div>
    `;
  }
  el.innerHTML = html;
}

async function createSet(){
  const slug = document.getElementById("new-slug").value.trim();
  const title = document.getElementById("new-title").value.trim();
  const desc = document.getElementById("new-desc").value.trim();
  const msgEl = document.getElementById("create-msg");
  if(!slug || !title){ msgEl.innerHTML = `<div class="msg err">Cần nhập slug và tên bộ đề.</div>`; return; }
  const data = await callRpc("admin_create_quiz_set", { p_password: PASSWORD, p_slug: slug, p_title: title, p_description: desc });
  if(data.status === "ok"){
    msgEl.innerHTML = `<div class="msg ok">Đã tạo bộ đề "${esc(title)}".</div>`;
    document.getElementById("new-slug").value = ""; document.getElementById("new-title").value = ""; document.getElementById("new-desc").value = "";
    await refreshSets();
  } else if(data.status === "unauthorized"){
    msgEl.innerHTML = `<div class="msg err">Sai mật khẩu.</div>`;
  } else if(data.message === "slug_exists"){
    msgEl.innerHTML = `<div class="msg err">Slug này đã tồn tại, chọn slug khác.</div>`;
  } else {
    msgEl.innerHTML = `<div class="msg err">Lỗi: thiếu thông tin.</div>`;
  }
}

  currentSlug = slug;
  const set = quizSets.find(s => s.slug === slug);
  const panel = document.getElementById("detail-panel");
  panel.innerHTML = `
    <div class="card">
      <h2>${esc(set.title)} <span class="muted">(${esc(slug)})</span></h2>
      <div class="row">
        <button class="btn-secondary" onclick="toggleActive('${slug.replace(/'/g,"\\'")}', ${!set.is_active})">${set.is_active ? "Ẩn bộ đề" : "Mở lại bộ đề"}</button>
        <button class="btn-danger" onclick="deleteSet('${slug.replace(/'/g,"\\'")}')">Xoá bộ đề (và toàn bộ câu hỏi/lượt làm)</button>
      </div>

      <h2 style="margin-top:18px;">Nhập câu hỏi từ Excel</h2>
      <p class="muted">File .xlsx cần đúng thứ tự cột (dòng đầu là tiêu đề, sẽ bị bỏ qua): <b>STT, Câu hỏi, Lựa chọn 1, Lựa chọn 2, Lựa chọn 3, Lựa chọn 4, Đáp án đúng, Giải thích, Chương/Chủ đề</b>. Cột "Đáp án đúng" phải ghi đúng nguyên văn 1 trong 4 lựa chọn. Import lại cùng STT sẽ ghi đè câu cũ (dùng để sửa/cập nhật).</p>
      <input type="file" id="excel-file" accept=".xlsx,.xls,.csv">
      <button class="btn-primary" style="margin-top:10px;" onclick="importExcel()">Nhập câu hỏi</button>
      <div id="import-msg"></div>

      <h2 style="margin-top:18px;">Câu hỏi trong bộ đề</h2>
      <div id="questions-table"><span class="muted">Đang tải...</span></div>

      <h2 style="margin-top:18px;">Lượt làm bài</h2>
      <div id="attempts-table"><span class="muted">Đang tải...</span></div>
    </div>

  await refreshSets();
  openDetail(slug);

async function deleteSet(slug){
  if(!confirm("Xoá vĩnh viễn bộ đề này cùng toàn bộ câu hỏi và lượt làm bài?")) return;
  await callRpc("admin_delete_quiz_set", { p_password: PASSWORD, p_slug: slug });

let lastLoadedQuestions = [];
let editingQuestionId = null;

async function loadQuestions(slug){
  const data = await callRpc("admin_list_quiz_questions", { p_password: PASSWORD, p_quiz_slug: slug });
  const el = document.getElementById("questions-table");
  if(!data || data.status !== "ok"){ el.innerHTML = `<p class="muted">Không tải được.</p>`; return; }
  const qs = data.questions;
  lastLoadedQuestions = qs;
  editingQuestionId = null;
  if(qs.length === 0){ el.innerHTML = `<p class="muted">Chưa có câu hỏi nào.</p>`; return; }
  el.innerHTML = `
    <table>
      <tr><th>#</th><th>Câu hỏi</th><th>Đáp án đúng</th><th>Chủ đề</th><th></th></tr>
      ${qs.map((q,i) => `
        <tr>
          <td>${q.stt}</td>
          <td>${esc(q.question)}</td>
          <td>${esc(q.correct_answer)}</td>
          <td>${esc(q.topic||"")}</td>
          <td style="white-space:nowrap;">
            <button class="btn-secondary" onclick="editQuestion(${i})">Sửa</button>
            <button class="btn-danger" onclick="deleteQuestion(${q.id},'${slug.replace(/'/g,"\\'")}')">Xoá</button>
          </td>
        </tr>
      `).join("")}
    </table>
    <div id="question-edit-area"></div>
  `;
}
async function deleteQuestion(id, slug){
  if(!confirm("Xoá câu hỏi này?")) return;
  await callRpc("admin_delete_quiz_question", { p_password: PASSWORD, p_id: id });
  loadQuestions(slug);
  refreshSets();
}

function editQuestion(i){
  const q = lastLoadedQuestions[i];
  if(!q) return;
  editingQuestionId = q.id;
  const area = document.getElementById("question-edit-area");
  if(!area) return;
  const hasOptions = [q.option_a, q.option_b, q.option_c, q.option_d].some(o => o !== undefined && o !== null && o !== "");
  area.innerHTML = `
    <div class="card" style="background:#f7f9ff;margin-top:12px;">
      <h3 style="margin-top:0;">✏️ Sửa câu ${esc(String(q.stt))}</h3>
      ${!hasOptions ? `<div class="msg err">Không lấy được 4 đáp án gốc của câu này qua danh sách — hãy nhập lại đầy đủ cả 4 lựa chọn bên dưới trước khi lưu để khỏi mất dữ liệu (hoặc sửa trực tiếp qua file Excel rồi nhập lại nếu không chắc nội dung gốc).</div>` : ""}
      <label>Câu hỏi</label>
      <textarea id="eq-question" rows="2">${esc(q.question||"")}</textarea>
      <div class="row">
        <div><label>Lựa chọn A</label><input type="text" id="eq-a" value="${esc(q.option_a||"")}" oninput="refreshCorrectAnswerOptions()"></div>
        <div><label>Lựa chọn B</label><input type="text" id="eq-b" value="${esc(q.option_b||"")}" oninput="refreshCorrectAnswerOptions()"></div>
      </div>
      <div class="row">
        <div><label>Lựa chọn C</label><input type="text" id="eq-c" value="${esc(q.option_c||"")}" oninput="refreshCorrectAnswerOptions()"></div>
        <div><label>Lựa chọn D</label><input type="text" id="eq-d" value="${esc(q.option_d||"")}" oninput="refreshCorrectAnswerOptions()"></div>
      </div>
      <label>Đáp án đúng</label>
      <select id="eq-correct"></select>
      <label>Giải thích (hiện cho học viên sau khi trả lời, có thể để trống)</label>
      <textarea id="eq-explain" rows="2">${esc(q.explanation||"")}</textarea>
      <label>Chủ đề / Chương</label>
      <input type="text" id="eq-topic" value="${esc(q.topic||"")}">
      <div class="row" style="margin-top:10px;">
        <button class="btn-primary" type="button" onclick="saveQuestionEdit('${currentSlug.replace(/'/g,"\\'")}')">💾 Lưu câu hỏi</button>
        <button class="btn-secondary" type="button" onclick="document.getElementById('question-edit-area').innerHTML=''">Huỷ</button>
      </div>
      <div id="eq-msg"></div>
    </div>
  `;
  refreshCorrectAnswerOptions(q.correct_answer);
  area.scrollIntoView({behavior:"smooth", block:"center"});
}

function refreshCorrectAnswerOptions(selectedValue){
  const sel = document.getElementById("eq-correct");
  if(!sel) return;
  const prev = selectedValue !== undefined ? selectedValue : sel.value;
  const opts = [
    document.getElementById("eq-a").value,
    document.getElementById("eq-b").value,
    document.getElementById("eq-c").value,
    document.getElementById("eq-d").value
  ];
  sel.innerHTML = opts.map(o => `<option value="${esc(o)}" ${o===prev ? "selected" : ""}>${esc(o || "(trống)")}</option>`).join("");
}

async function saveQuestionEdit(slug){
  const q = lastLoadedQuestions.find(x => x.id === editingQuestionId);
  const msgEl = document.getElementById("eq-msg");
  if(!q){ if(msgEl) msgEl.innerHTML = `<div class="msg err">Có lỗi, hãy tải lại trang.</div>`; return; }
  const question = document.getElementById("eq-question").value.trim();
  const a = document.getElementById("eq-a").value.trim();
  const b = document.getElementById("eq-b").value.trim();
  const c = document.getElementById("eq-c").value.trim();
  const d = document.getElementById("eq-d").value.trim();
  const correct = document.getElementById("eq-correct").value;
  const explain = document.getElementById("eq-explain").value.trim();
  const topic = document.getElementById("eq-topic").value.trim();
  if(!question || !a || !b || !c || !d || !correct){
    msgEl.innerHTML = `<div class="msg err">Cần nhập đủ nội dung câu hỏi, cả 4 lựa chọn và chọn đáp án đúng.</div>`;
    return;
  }
  msgEl.innerHTML = `<div class="msg">Đang lưu...</div>`;
  const data = await callRpc("admin_bulk_upsert_quiz_questions", {
    p_password: PASSWORD, p_quiz_slug: slug,
    p_questions: [{ stt: q.stt, question, option_a: a, option_b: b, option_c: c, option_d: d, correct_answer: correct, explanation: explain, topic }]
  });
  if(data && data.status === "ok"){
    msgEl.innerHTML = `<div class="msg ok">Đã lưu câu hỏi.</div>`;
    loadQuestions(slug);
  } else {
    msgEl.innerHTML = `<div class="msg err">Lỗi khi lưu: ${esc(data && data.status)}</div>`;
  }
}

async function loadAttempts(slug){
  const data = await callRpc("admin_list_quiz_attempts", { p_password: PASSWORD, p_quiz_slug: slug, p_limit: 200, p_offset: 0 });
  const el = document.getElementById("attempts-table");
  if(!data || data.status !== "ok"){ el.innerHTML = `<p class="muted">Không tải được.</p>`; return; }
  const at = data.attempts;
  if(at.length === 0){ el.innerHTML = `<p class="muted">Chưa có ai làm bài.</p>`; return; }
  el.innerHTML = `
    <table>
      <tr><th>Người làm</th><th>Điểm</th><th>Thời gian nộp</th></tr>
      ${at.map(a => `
        <tr><td>${esc(a.taker_name)}</td><td>${a.score}/${a.total}</td><td>${new Date(a.finished_at).toLocaleString("vi-VN")}</td></tr>
      `).join("")}
    </table>
  `;
}

function readExcelFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const wb = XLSX.read(e.target.result, { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
        resolve(rows);
      } catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

async function importExcel(){
  const fileInput = document.getElementById("excel-file");
  const msgEl = document.getElementById("import-msg");
  if(!fileInput.files.length){ msgEl.innerHTML = `<div class="msg err">Chọn file Excel trước.</div>`; return; }
  msgEl.innerHTML = `<div class="msg">Đang đọc file...</div>`;
  let rows;
  try{ rows = await readExcelFile(fileInput.files[0]); }
  catch(err){ msgEl.innerHTML = `<div class="msg err">Không đọc được file: ${esc(err.message)}</div>`; return; }

  // Bỏ hàng tiêu đề (dò hàng đầu tiên có cột 1 không phải số => tiêu đề)
  let startRow = 0;
  if(rows.length && isNaN(parseInt(rows[0][0]))) startRow = 1;

  const questions = [];
  for(let i = startRow; i < rows.length; i++){
    const r = rows[i];
    if(!r || r.length === 0 || (!r[1] && !r[1+0])) continue;
    const stt = parseInt(r[0]);
    const question = String(r[1]||"").trim();
    if(!question) continue;
    questions.push({
      stt: isNaN(stt) ? undefined : stt,
      question,
      option_a: String(r[2]||"").trim(),
      option_b: String(r[3]||"").trim(),
      option_c: String(r[4]||"").trim(),
      option_d: String(r[5]||"").trim(),
      correct_answer: String(r[6]||"").trim(),
      explanation: String(r[7]||"").trim(),
      topic: String(r[8]||"").trim()
    });
  }

  if(questions.length === 0){ msgEl.innerHTML = `<div class="msg err">Không tìm thấy câu hỏi hợp lệ trong file.</div>`; return; }

  msgEl.innerHTML = `<div class="msg">Đang nhập ${questions.length} câu hỏi...</div>`;
  const data = await callRpc("admin_bulk_upsert_quiz_questions", { p_password: PASSWORD, p_quiz_slug: currentSlug, p_questions: questions });
  if(data && data.status === "ok"){
    msgEl.innerHTML = `<div class="msg ok">Đã nhập/cập nhật ${data.upserted} câu hỏi.</div>`;
    fileInput.value = "";
    loadQuestions(currentSlug);
    refreshSets();
  } else {
    msgEl.innerHTML = `<div class="msg err">Lỗi khi nhập: ${esc(data && data.status)}</div>`;
  }
}

// tự đăng nhập nếu đã có mật khẩu lưu trong session
